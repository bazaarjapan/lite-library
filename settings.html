<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>図書館設定</title>
  <?!= includeHtml_('common_styles'); ?>
  <style>
    /* ページ固有: 補足テキストとトグルスイッチ */
    .help-text {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin: 0.375rem 0 0;
    }
    .toggle-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.9rem;
    }
    .toggle-switch {
      position: relative;
      flex-shrink: 0;
      width: 3.25rem;
      height: 1.75rem;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: var(--border-strong);
      transition: 0.2s;
      border-radius: 999px;
    }
    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 1.375rem;
      width: 1.375rem;
      left: 0.1875rem;
      bottom: 0.1875rem;
      background-color: #fff;
      transition: 0.2s;
      border-radius: 50%;
    }
    input:checked + .toggle-slider {
      background-color: var(--accent);
    }
    input:checked + .toggle-slider:before {
      transform: translateX(1.5rem);
    }
  </style>
</head>
<body>
  <header class="app-header">
    <a href="#" class="app-header-back js-menu-link">← メニュー</a>
    <span class="app-header-title"><span class="group-dot report"></span>図書館設定</span>
  </header>

  <main class="app-main">
    <!-- 基本設定 -->
    <div class="card">
      <h2 class="card-title">基本設定</h2>

      <div class="field">
        <label for="lending-days">貸出期間（日数）</label>
        <input type="number" id="lending-days" min="1" max="365" value="14">
        <p class="help-text">本を借りられる標準日数を設定します</p>
      </div>

      <div class="field">
        <label for="max-books">一人あたりの最大貸出冊数</label>
        <input type="number" id="max-books" min="1" max="100" value="5">
        <p class="help-text">一人が同時に借りられる本の最大冊数</p>
      </div>

      <div class="field">
        <label for="max-renewals">貸出延長の上限回数</label>
        <input type="number" id="max-renewals" min="0" max="10" value="1">
        <p class="help-text">1回の貸出で延長できる回数(0で延長禁止)</p>
      </div>

      <div class="field">
        <label for="reminder-days">返却リマインダー（日前）</label>
        <input type="number" id="reminder-days" min="1" max="30" value="3">
        <p class="help-text">返却期限の何日前にリマインダーメールを送信するか</p>
      </div>
    </div>

    <!-- 通知設定 -->
    <div class="card">
      <h2 class="card-title">通知設定</h2>

      <div class="field">
        <label for="enable-email">メール通知を有効にする</label>
        <div class="toggle-container">
          <div class="toggle-switch">
            <input type="checkbox" id="enable-email" checked>
            <span class="toggle-slider"></span>
          </div>
          <span>貸出・返却時にメール通知を送信</span>
        </div>
      </div>

      <div class="field">
        <label for="enable-overdue">延滞通知を有効にする</label>
        <div class="toggle-container">
          <div class="toggle-switch">
            <input type="checkbox" id="enable-overdue" checked>
            <span class="toggle-slider"></span>
          </div>
          <span>返却期限を過ぎた場合に通知</span>
        </div>
      </div>

      <div class="field">
        <label for="library-email">図書館メールアドレス</label>
        <input type="email" id="library-email" placeholder="library@example.com">
        <p class="help-text">送信元として使用するメールアドレス</p>
      </div>
    </div>

    <!-- 運用設定 -->
    <div class="card">
      <h2 class="card-title">運用設定</h2>

      <div class="field">
        <label for="library-name">図書館名</label>
        <input type="text" id="library-name" placeholder="〇〇図書館">
        <p class="help-text">メールやカードに表示される図書館名</p>
      </div>

      <div class="field">
        <label for="operation-mode">運用モード</label>
        <select id="operation-mode">
          <option value="normal">通常運用</option>
          <option value="test">テストモード</option>
          <option value="maintenance">メンテナンスモード</option>
          <option value="development">開発モード(データ初期化などの開発用メニューが有効)</option>
        </select>
        <p class="help-text">システムの運用状態を設定</p>
      </div>
    </div>

    <div class="button-group">
      <button class="btn-primary btn-lg btn-block" onclick="saveSettings()">設定を保存</button>
    </div>

    <div id="message"></div>
  </main>

  <script>
    // DOMが読み込まれたら実行
    document.addEventListener('DOMContentLoaded', function() {
      loadSettings();
    });

    // 設定を読み込む
    function loadSettings() {
      google.script.run
        .withSuccessHandler(function(settings) {
          if (settings) {
            document.getElementById('lending-days').value = settings.lendingDays || 14;
            document.getElementById('max-books').value = settings.maxBooks || 5;
            document.getElementById('max-renewals').value = (settings.maxRenewals !== undefined && settings.maxRenewals !== '') ? settings.maxRenewals : 1;
            document.getElementById('reminder-days').value = settings.reminderDays || 3;
            document.getElementById('enable-email').checked = settings.enableEmail !== false;
            document.getElementById('enable-overdue').checked = settings.enableOverdue !== false;
            document.getElementById('library-email').value = settings.libraryEmail || '';
            document.getElementById('library-name').value = settings.libraryName || '';
            document.getElementById('operation-mode').value = settings.operationMode || 'normal';
          }
        })
        .withFailureHandler(function(error) {
          showMessage('設定の読み込みに失敗しました: ' + error.message, 'error');
        })
        .getLibrarySettings();
    }

    // 設定を保存する
    function saveSettings() {
      const settings = {
        lendingDays: parseInt(document.getElementById('lending-days').value),
        maxBooks: parseInt(document.getElementById('max-books').value),
        maxRenewals: parseInt(document.getElementById('max-renewals').value),
        reminderDays: parseInt(document.getElementById('reminder-days').value),
        enableEmail: document.getElementById('enable-email').checked,
        enableOverdue: document.getElementById('enable-overdue').checked,
        libraryEmail: document.getElementById('library-email').value,
        libraryName: document.getElementById('library-name').value,
        operationMode: document.getElementById('operation-mode').value
      };

      // バリデーション
      if (settings.lendingDays < 1 || settings.lendingDays > 365) {
        showMessage('貸出期間は1日から365日の間で設定してください', 'error');
        return;
      }

      if (isNaN(settings.maxRenewals) || settings.maxRenewals < 0 || settings.maxRenewals > 10) {
        showMessage('貸出延長の上限回数は0回から10回の間で設定してください', 'error');
        return;
      }

      if (settings.maxBooks < 1 || settings.maxBooks > 100) {
        showMessage('最大貸出冊数は1冊から100冊の間で設定してください', 'error');
        return;
      }

      showMessage('設定を保存中...', '');

      google.script.run
        .withSuccessHandler(function(result) {
          if (result && result.success) {
            showMessage('設定を保存しました', 'success');
          } else {
            showMessage('設定の保存に失敗しました: ' + (result && result.message ? result.message : '不明なエラー'), 'error');
          }
        })
        .withFailureHandler(function(error) {
          showMessage('設定の保存に失敗しました: ' + error.message, 'error');
        })
        .saveLibrarySettings(settings);
    }

    // メッセージを表示
    function showMessage(message, type) {
      const messageEl = document.getElementById('message');
      messageEl.textContent = message;
      messageEl.className = type;

      if (type === 'success') {
        setTimeout(function() {
          messageEl.textContent = '';
          messageEl.className = '';
        }, 3000);
      }
    }
  </script>

  <script>
    // WebアプリのURLはテンプレート評価時にサーバー側で埋め込まれる(往復なしで即時設定)
    (function() {
      const url = '<?!= getWebAppUrl(); ?>';
      document.querySelectorAll('.js-menu-link').forEach(el => { el.href = url; });
    })();
  </script>
</body>
</html>
