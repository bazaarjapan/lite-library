<script>
(function() {
  'use strict';

  const QUAGGA_URL = 'https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js';
  const DEFAULT_READERS = [
    'code_128_reader',
    'code_39_reader',
    'code_93_reader',
    'codabar_reader',
    'ean_reader',
    'ean_8_reader',
    'upc_reader',
    'upc_e_reader'
  ];

  let config = {
    contexts: {},
    onOpen: null,
    onClose: null,
    onScan: null
  };
  let activeSession = null;

  function mergeConfig(nextConfig) {
    config = {
      contexts: Object.assign({}, config.contexts, nextConfig.contexts || {}),
      onOpen: nextConfig.onOpen || config.onOpen,
      onClose: nextConfig.onClose || config.onClose,
      onScan: nextConfig.onScan || config.onScan
    };
  }

  function getContext(viewportId, inputFieldId) {
    const context = Object.assign({}, config.contexts[viewportId] || {});
    context.viewportId = viewportId;
    context.inputFieldId = inputFieldId || context.inputFieldId;
    context.label = context.label || (context.inputFieldId === 'user-id' ? '利用者ID' : '書籍ID');
    context.title = context.title || `${context.label}をスキャン`;
    context.readers = context.readers || DEFAULT_READERS;
    return context;
  }

  function setMessageSafe(message) {
    if (typeof window.setMessage === 'function') {
      window.setMessage(message);
    } else {
      console.log(message);
    }
  }

  function playBeepSafe() {
    if (typeof window.playBeepSound === 'function') {
      window.playBeepSound();
    }
  }

  function closeActiveSession(reason) {
    if (!activeSession) return;
    const session = activeSession;
    activeSession = null;

    if (session.closeTimer) {
      clearInterval(session.closeTimer);
    }
    if (session.popup && !session.popup.closed && reason !== 'popup-closed') {
      session.popup.close();
    }
    if (session.objectUrl) {
      URL.revokeObjectURL(session.objectUrl);
    }
    if (typeof config.onClose === 'function') {
      config.onClose(session.context, reason || 'closed');
    }
  }

  function handleScan(session, code) {
    const normalizedCode = (code || '').toString().trim();
    if (!normalizedCode) {
      return;
    }

    const input = document.getElementById(session.context.inputFieldId);
    if (input) {
      input.value = normalizedCode;
      input.dispatchEvent(new Event('input', { bubbles: true }));
    }

    playBeepSafe();
    setMessageSafe(`${session.context.label}「${normalizedCode}」を読み取りました。`);

    if (typeof config.onScan === 'function') {
      config.onScan({
        code: normalizedCode,
        inputFieldId: session.context.inputFieldId,
        viewportId: session.context.viewportId,
        context: session.context
      });
    }
  }

  window.addEventListener('message', function(event) {
    const data = event.data || {};
    if (!activeSession || event.source !== activeSession.popup) return;
    if (data.source !== 'lite-library-barcode-scanner' || data.token !== activeSession.token) return;

    const session = activeSession;
    if (data.type === 'detected') {
      closeActiveSession('detected');
      handleScan(session, data.code);
    } else if (data.type === 'error') {
      // ポップアップは閉じない(中に理由と再試行ボタンが表示される)。
      // 即クローズすると「開いてもすぐ閉じる」ように見えて原因が分からないため
      setMessageSafe(data.message || 'カメラを起動できませんでした。手入力してください。');
    } else if (data.type === 'ready') {
      setMessageSafe(`${session.context.label}をカメラに向けてください。`);
    }
  });

  function openScanner(viewportId, inputFieldId) {
    const context = getContext(viewportId, inputFieldId);
    const token = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    closeActiveSession('replaced');

    const popup = window.open('', 'liteLibraryBarcodeScanner', 'width=520,height=760');

    if (!popup) {
      setMessageSafe('スキャン用ウィンドウを開けませんでした。ポップアップを許可するか、手入力してください。');
      return;
    }

    const popupConfig = {
      token: token,
      title: context.title,
      label: context.label,
      facingMode: context.facingMode || 'environment',
      readers: context.readers,
      quaggaUrl: QUAGGA_URL
    };
    const html = buildPopupHtml(popupConfig);
    const objectUrl = URL.createObjectURL(new Blob([html], { type: 'text/html' }));

    activeSession = {
      popup: popup,
      objectUrl: objectUrl,
      token: token,
      context: context,
      closeTimer: null
    };

    if (typeof config.onOpen === 'function') {
      config.onOpen(context);
    }

    popup.location.replace(objectUrl);
    activeSession.closeTimer = setInterval(function() {
      if (!activeSession || activeSession.popup !== popup) return;
      if (popup.closed) {
        closeActiveSession('popup-closed');
        setMessageSafe('スキャンをキャンセルしました。');
      }
    }, 500);
  }

  function buildPopupHtml(popupConfig) {
    const serializedConfig = JSON.stringify(popupConfig).replace(/</g, '\\u003c');
    const scriptClose = '</' + 'script>';
    return `<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${escapeHtml(popupConfig.title)}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      min-height: 100vh;
      background: #111827;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 14px 16px;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    h1 { margin: 0; font-size: 18px; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 16px;
      font-weight: 700;
      background: #f8fafc;
      color: #0f172a;
      cursor: pointer;
    }
    #viewport {
      position: relative;
      flex: 1;
      min-height: 420px;
      overflow: hidden;
      background: #020617;
    }
    #viewport video,
    #viewport canvas {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      max-height: none !important;
      display: block;
      object-fit: cover;
      transform: none !important;
    }
    #viewport video {
      z-index: 0;
    }
    #viewport canvas {
      z-index: 1;
      pointer-events: none;
    }
    #message {
      padding: 12px 16px;
      background: #1f2937;
      color: #e5e7eb;
      font-size: 15px;
      line-height: 1.5;
    }
    .guide {
      position: absolute;
      top: 36%;
      right: 8%;
      bottom: 36%;
      left: 8%;
      border: 3px solid rgba(250, 204, 21, 0.95);
      border-radius: 12px;
      pointer-events: none;
      box-shadow: 0 0 0 999px rgba(0, 0, 0, 0.22);
      z-index: 2;
    }
  </style>
</head>
<body>
  <header>
    <h1>${escapeHtml(popupConfig.title)}</h1>
    <div>
      <button type="button" id="zoom-out" style="display:none">−</button>
      <button type="button" id="zoom-in" style="display:none">＋</button>
      <button type="button" id="retry" style="display:none">再試行</button>
      <button type="button" id="switch-camera">切替</button>
      <button type="button" id="close-window">閉じる</button>
    </div>
  </header>
  <div id="viewport"><div class="guide"></div></div>
  <div id="message">カメラを起動しています...</div>
  <script src="${QUAGGA_URL}">${scriptClose}
  <script>
    window.SCANNER_CONFIG = ${serializedConfig};
    (${popupMain.toString()})();
  ${scriptClose}
</body>
</html>`;
  }

  function popupMain() {
    'use strict';
    var config = window.SCANNER_CONFIG;
    var facingMode = config.facingMode || 'environment';
    var running = false;
    var lastDetectedCode = null;
    var lastDetectedTime = 0;
    var cooldownMs = 1600;

    function post(type, payload) {
      if (!window.opener) return;
      window.opener.postMessage(Object.assign({
        source: 'lite-library-barcode-scanner',
        token: config.token,
        type: type
      }, payload || {}), '*');
    }

    function setMessage(message) {
      var el = document.getElementById('message');
      if (el) el.textContent = message;
    }

    // エラーをこのウィンドウ内に表示し、再試行ボタンを出す(ウィンドウは閉じない)。
    // 親ページにも通知してメッセージを表示させる
    function showError(message) {
      setMessage(message);
      var retryButton = document.getElementById('retry');
      if (retryButton) retryButton.style.display = '';
      post('error', { message: message });
    }

    // Quaggaライブラリを動的に(再)読込してから起動をやり直す。
    // 初回<script>のCDN読込が失敗した場合、再試行のたびにここで読み直す
    function loadQuaggaThenRestart() {
      setMessage('読み取りライブラリを読み込んでいます...');
      var previous = document.getElementById('quagga-reload');
      if (previous) previous.remove();
      var script = document.createElement('script');
      script.id = 'quagga-reload';
      script.src = config.quaggaUrl;
      script.onload = function() {
        if (window.Quagga) {
          start();
        } else {
          // 読み込めたのに定義されない異常ケース(無限再読込ループを防ぐ)
          showError('バーコード読み取りライブラリを初期化できませんでした。ウィンドウを閉じて手入力してください。');
        }
      };
      script.onerror = function() {
        showError('バーコード読み取りライブラリを読み込めませんでした。通信状態を確認して「再試行」を押してください。');
      };
      document.body.appendChild(script);
    }

    function cleanup() {
      running = false;
      if (window.Quagga) {
        try {
          Quagga.offDetected();
          Quagga.offProcessed();
          Quagga.stop();
        } catch (e) {
          console.log(e);
        }
      }
      document.querySelectorAll('video').forEach(function(video) {
        if (video.srcObject) {
          video.srcObject.getTracks().forEach(function(track) { track.stop(); });
        }
      });
    }

    function start() {
      cleanup();
      var retryButton = document.getElementById('retry');
      if (retryButton) retryButton.style.display = 'none';
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showError('このブラウザではカメラを使用できません。ウィンドウを閉じて手入力してください。');
        return;
      }
      if (!window.Quagga) {
        // 初回の<script>読込が失敗している。再試行が成立するよう、ここで
        // ライブラリを動的に再読込してから start() をやり直す
        loadQuaggaThenRestart();
        return;
      }

      setMessage('カメラを起動しています...');
      Quagga.init({
        inputStream: {
          name: 'Live',
          type: 'LiveStream',
          target: document.querySelector('#viewport'),
          constraints: {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: { ideal: facingMode },
            // 対応カメラでは近接時のピンボケを防ぐ(非対応環境では無視される)
            advanced: [{ focusMode: 'continuous' }]
          },
          area: { top: '36%', right: '8%', left: '8%', bottom: '36%' }
        },
        locator: {
          patchSize: 'medium',
          // 解析解像度を落とさない(書籍ISBNのような細かいコードの認識率を優先)
          halfSample: false
        },
        // blob URLページからのWeb Worker生成は失敗することがあり、その場合
        // フレーム解析が一切走らなくなるためメインスレッドで処理する
        numOfWorkers: 0,
        frequency: 10,
        decoder: {
          readers: config.readers || []
        },
        locate: true
      }, function(err) {
        if (err) {
          // getUserMedia成功後にinitが失敗したケースでは映像トラックが残るため、
          // ウィンドウを開いたままにする前に必ずカメラを解放する
          cleanup();
          var detail = err && (err.message || err.name) ? '(' + (err.name || 'Error') + ': ' + (err.message || '') + ')' : '';
          showError('カメラを起動できませんでした。ブラウザのカメラ許可を確認して「再試行」を押すか、閉じて手入力してください。' + detail);
          return;
        }
        running = true;
        Quagga.start();
        setMessage(config.label + 'のバーコードを枠内に合わせてください。');
        post('ready');
        setupZoomControls();
      });

      Quagga.onDetected(function(result) {
        if (!running || !result || !result.codeResult || !result.codeResult.code) return;
        var confidence = result.codeResult.confidence;
        if (typeof confidence === 'number' && confidence < 0.45) return;

        var code = String(result.codeResult.code).trim();
        var now = Date.now();
        if (!code || (code === lastDetectedCode && now - lastDetectedTime < cooldownMs)) return;

        lastDetectedCode = code;
        lastDetectedTime = now;
        running = false;
        setMessage('読み取りました: ' + code);
        post('detected', { code: code });
        setTimeout(function() { window.close(); }, 150);
      });
    }

    // カメラがズームに対応している場合のみ +/− ボタンを表示する
    // (小さいバーコードを狙いやすくする。非対応カメラではボタン非表示のまま)
    function setupZoomControls() {
      var zoomInButton = document.getElementById('zoom-in');
      var zoomOutButton = document.getElementById('zoom-out');
      zoomInButton.style.display = 'none';
      zoomOutButton.style.display = 'none';

      var video = document.querySelector('#viewport video');
      var stream = video && video.srcObject;
      var track = stream && stream.getVideoTracks ? stream.getVideoTracks()[0] : null;
      if (!track || typeof track.getCapabilities !== 'function') return;

      var capabilities;
      try {
        capabilities = track.getCapabilities();
      } catch (e) {
        return;
      }
      if (!capabilities || !capabilities.zoom || capabilities.zoom.max <= capabilities.zoom.min) return;

      var range = capabilities.zoom;
      var step = range.step && range.step > 0 ? range.step : (range.max - range.min) / 10;
      var current = range.min;
      if (typeof track.getSettings === 'function' && track.getSettings().zoom) {
        current = track.getSettings().zoom;
      }

      function applyZoom(value) {
        current = Math.min(range.max, Math.max(range.min, value));
        track.applyConstraints({ advanced: [{ zoom: current }] }).catch(function() {});
      }

      zoomInButton.style.display = '';
      zoomOutButton.style.display = '';
      // カメラ切替のたびに再セットアップされるため、多重登録されないonclick代入にする
      zoomInButton.onclick = function() { applyZoom(current + step * 2); };
      zoomOutButton.onclick = function() { applyZoom(current - step * 2); };
    }

    document.getElementById('switch-camera').addEventListener('click', function() {
      facingMode = facingMode === 'environment' ? 'user' : 'environment';
      start();
    });
    document.getElementById('retry').addEventListener('click', function() {
      start();
    });
    document.getElementById('close-window').addEventListener('click', function() {
      cleanup();
      window.close();
    });
    window.addEventListener('beforeunload', cleanup);
    start();
  }

  function escapeHtml(value) {
    return String(value || '').replace(/[&<>"']/g, function(ch) {
      return {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[ch];
    });
  }

  function switchScannerCamera(viewportId) {
    const context = getContext(viewportId);
    context.facingMode = context.facingMode === 'user' ? 'environment' : 'user';
    config.contexts[viewportId] = context;
    openScanner(viewportId, context.inputFieldId);
  }

  function configureScanner(nextConfig) {
    mergeConfig(nextConfig || {});

    window.toggleScanner = function(viewportId, inputFieldId) {
      openScanner(viewportId, inputFieldId);
    };
    window.closeScanner = function() {
      closeActiveSession('closed');
    };
    window.switchCamera = switchScannerCamera;
    window.stopScanner = function() {
      closeActiveSession('stopped');
    };
  }

  window.LiteLibraryBarcodeScanner = {
    configure: configureScanner,
    open: openScanner,
    close: function() { closeActiveSession('closed'); },
    switchCamera: switchScannerCamera
  };
})();
</script>
