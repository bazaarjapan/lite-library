<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>貸出統計</title>
  <?!= includeHtml_('common_styles'); ?>
  <style>
    /* ページ固有: 期間切替ボタン・統計カード・ランキングリスト */
    .period-buttons {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .period-button { flex: 1 1 auto; }
    .period-button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 700;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.625rem;
      margin-bottom: 1rem;
    }
    @media (min-width: 768px) {
      .stats-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 0.75rem;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .stat-icon { font-size: 1.25rem; }
    .stat-value {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .ranking-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .ranking-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 0.25rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }
    .ranking-item:last-child { border-bottom: none; }
    .ranking-number {
      flex-shrink: 0;
      width: 2rem;
      text-align: center;
      font-weight: 700;
      color: var(--accent);
    }
    .ranking-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ranking-count {
      flex-shrink: 0;
      font-weight: 700;
      color: var(--text-muted);
    }
    .export-row { text-align: center; margin-top: 1rem; }
  </style>
</head>
<body>
  <header class="app-header">
    <a href="#" class="app-header-back js-menu-link">← メニュー</a>
    <span class="app-header-title"><span class="group-dot report"></span>貸出統計</span>
  </header>

  <main class="app-main wide">
    <!-- 期間選択 -->
    <div class="card">
      <h2 class="card-title">集計期間</h2>
      <div class="period-buttons">
        <button class="period-button active" onclick="changePeriod('week')">今週</button>
        <button class="period-button" onclick="changePeriod('month')">今月</button>
        <button class="period-button" onclick="changePeriod('year')">今年</button>
        <button class="period-button" onclick="changePeriod('all')">全期間</button>
      </div>
    </div>

    <!-- 統計カード -->
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">📚</div>
        <div class="stat-value" id="total-lending">-</div>
        <div class="stat-label">総貸出数</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">📖</div>
        <div class="stat-value" id="current-lending">-</div>
        <div class="stat-label">貸出中</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">✅</div>
        <div class="stat-value" id="returned">-</div>
        <div class="stat-label">返却済</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">⏰</div>
        <div class="stat-value" id="overdue">-</div>
        <div class="stat-label">延滞中</div>
      </div>
    </div>

    <!-- 人気書籍ランキング -->
    <div class="card">
      <h2 class="card-title">人気書籍ランキング TOP10</h2>
      <ol class="ranking-list" id="book-ranking"></ol>
    </div>

    <!-- アクティブ利用者ランキング -->
    <div class="card">
      <h2 class="card-title">アクティブ利用者ランキング TOP10</h2>
      <ol class="ranking-list" id="user-ranking"></ol>
    </div>

    <!-- エクスポートボタン -->
    <div class="export-row">
      <button onclick="exportStatistics()">📊 統計レポートを出力</button>
    </div>

    <div id="message"></div>
      <div class="bottom-menu-link">
        <a href="#" class="btn btn-block js-menu-link">← メニューに戻る</a>
      </div>
    </main>

  <script>
    let currentPeriod = 'week';
    let statisticsData = null;

    // ページ読み込み時に統計データを取得
    document.addEventListener('DOMContentLoaded', function() {
      loadStatistics();
    });

    // 期間を変更する関数
    function changePeriod(period) {
      currentPeriod = period;

      // ボタンのアクティブ状態を更新
      const buttons = document.querySelectorAll('.period-button');
      buttons.forEach(button => {
        button.classList.remove('active');
        if (button.textContent.includes(getPeriodText(period))) {
          button.classList.add('active');
        }
      });

      // データを再表示
      if (statisticsData) {
        displayStatistics(statisticsData);
      }
    }

    // 期間のテキストを取得
    function getPeriodText(period) {
      const texts = {
        week: '今週',
        month: '今月',
        year: '今年',
        all: '全期間'
      };
      return texts[period] || '今週';
    }

    // 統計データを読み込む関数
    function loadStatistics() {
      showMessage('統計データを読み込み中...', '');

      google.script.run
        .withSuccessHandler(function(data) {
          statisticsData = data;
          displayStatistics(data);
          showMessage('', '');
        })
        .withFailureHandler(function(error) {
          showMessage('統計データの読み込みに失敗しました: ' + error.message, 'error');
        })
        .getLibraryStatistics();
    }

    // 統計データを表示する関数
    function displayStatistics(data) {
      // 期間でフィルタリング
      const filteredData = filterByPeriod(data, currentPeriod);

      // 統計カードを更新
      document.getElementById('total-lending').textContent = filteredData.totalLending;
      document.getElementById('current-lending').textContent = filteredData.currentLending;
      document.getElementById('returned').textContent = filteredData.returned;
      document.getElementById('overdue').textContent = filteredData.overdue;

      // 人気書籍ランキングを更新
      displayBookRanking(filteredData.popularBooks);

      // アクティブ利用者ランキングを更新
      displayUserRanking(filteredData.activeUsers);
    }

    // 期間でフィルタリングする関数
    function filterByPeriod(data, period) {
      const now = new Date();
      let startDate;

      switch (period) {
        case 'week':
          startDate = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
          break;
        case 'month':
          startDate = new Date(now.getFullYear(), now.getMonth(), 1);
          break;
        case 'year':
          startDate = new Date(now.getFullYear(), 0, 1);
          break;
        default:
          startDate = new Date(0); // 全期間
      }

      // フィルタリングされたデータを計算
      const filtered = {
        totalLending: 0,
        currentLending: 0,
        returned: 0,
        overdue: 0,
        popularBooks: {},
        activeUsers: {}
      };

      data.records.forEach(record => {
        const lendingDate = new Date(record.lendingDate);
        if (lendingDate >= startDate) {
          filtered.totalLending++;

          if (record.status === '未返却') {
            filtered.currentLending++;
            if (record.isOverdue) {
              filtered.overdue++;
            }
          } else {
            filtered.returned++;
          }

          // 書籍カウント
          if (!filtered.popularBooks[record.bookTitle]) {
            filtered.popularBooks[record.bookTitle] = 0;
          }
          filtered.popularBooks[record.bookTitle]++;

          // 利用者カウント
          if (!filtered.activeUsers[record.userName]) {
            filtered.activeUsers[record.userName] = 0;
          }
          filtered.activeUsers[record.userName]++;
        }
      });

      return filtered;
    }

    // 人気書籍ランキングを表示
    function displayBookRanking(bookData) {
      const ranking = Object.entries(bookData)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10);

      const rankingList = document.getElementById('book-ranking');
      rankingList.innerHTML = '';

      if (ranking.length === 0) {
        rankingList.innerHTML = '<li class="ranking-item">データがありません</li>';
        return;
      }

      ranking.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = 'ranking-item';
        li.innerHTML = `
          <span class="ranking-number">${index + 1}</span>
          <span class="ranking-name">${escapeHtml(item[0])}</span>
          <span class="ranking-count">${item[1]}回</span>
        `;
        rankingList.appendChild(li);
      });
    }

    // アクティブ利用者ランキングを表示
    function displayUserRanking(userData) {
      const ranking = Object.entries(userData)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10);

      const rankingList = document.getElementById('user-ranking');
      rankingList.innerHTML = '';

      if (ranking.length === 0) {
        rankingList.innerHTML = '<li class="ranking-item">データがありません</li>';
        return;
      }

      ranking.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = 'ranking-item';
        li.innerHTML = `
          <span class="ranking-number">${index + 1}</span>
          <span class="ranking-name">${escapeHtml(item[0])}</span>
          <span class="ranking-count">${item[1]}冊</span>
        `;
        rankingList.appendChild(li);
      });
    }

    // 統計レポートをエクスポート
    function exportStatistics() {
      showMessage('統計レポートを作成中...', '');

      google.script.run
        .withSuccessHandler(function(result) {
          showMessage('統計レポートを作成しました', '');
        })
        .withFailureHandler(function(error) {
          showMessage('レポート作成に失敗しました: ' + error.message, 'error');
        })
        .createStatisticsReport(currentPeriod);
    }

    // メッセージを表示する関数
    function showMessage(message, type) {
      const messageEl = document.getElementById('message');
      messageEl.textContent = message;
      messageEl.className = type;

      if (type !== 'error' && message === '') {
        setTimeout(function() {
          messageEl.textContent = '';
          messageEl.className = '';
        }, 3000);
      }
    }

    // HTMLエスケープ関数
    function escapeHtml(unsafe) {
      if (!unsafe) return '';
      return unsafe
        .toString()
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>

  <script>
    // WebアプリのURLはテンプレート評価時にサーバー側で埋め込まれる(往復なしで即時設定)
    (function() {
      const url = '<?!= getWebAppUrl(); ?>';
      document.querySelectorAll('.js-menu-link').forEach(el => { el.href = url; });
    })();
  </script>
</body>
</html>
