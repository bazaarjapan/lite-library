<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>延滞者リスト</title>
  <?!= includeHtml_('common_styles'); ?>
  <style>
    /* ページ固有: フィルター行とサマリー表示 */
    .filter-row {
      display: flex;
      gap: 0.625rem;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .filter-row .field { flex: 1 1 10rem; margin-bottom: 0; }
    .summary-box {
      background: var(--danger-soft);
      border: 1px solid #d9a49f;
      border-radius: var(--radius);
      padding: 0.625rem 0.75rem;
      margin-bottom: 0.75rem;
      text-align: center;
      font-weight: 700;
      color: var(--danger);
    }
    .book-title { color: var(--text-muted); }
    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
    }
    .empty-icon { font-size: 2rem; opacity: 0.6; }
    .empty-text { font-weight: 700; }
  </style>
</head>
<body>
  <header class="app-header">
    <a href="#" class="app-header-back js-menu-link">← メニュー</a>
    <span class="app-header-title"><span class="group-dot report"></span>延滞者リスト</span>
  </header>

  <main class="app-main wide">
    <!-- フィルター部分 -->
    <div class="card">
      <h2 class="card-title">絞り込み</h2>
      <div class="filter-row">
        <div class="field">
          <label for="overdue-filter">延滞日数</label>
          <select id="overdue-filter">
            <option value="all">すべて</option>
            <option value="7">7日以上</option>
            <option value="14">14日以上</option>
            <option value="30">30日以上</option>
          </select>
        </div>
        <button class="btn-primary" onclick="searchOverdue()">検索</button>
        <button onclick="exportToSheet()">📊 レポート出力</button>
      </div>
    </div>

    <!-- リスト表示部分 -->
    <div class="card" id="list-section" style="display: none;">
      <div class="summary-box">
        <div class="summary-text" id="summary-text"></div>
      </div>

      <div class="table-wrap">
        <table id="overdue-table">
          <thead>
            <tr>
              <th>利用者ID</th>
              <th>利用者名</th>
              <th>書籍ID</th>
              <th>書籍名</th>
              <th>貸出日</th>
              <th>返却予定日</th>
              <th>延滞日数</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>

      <div class="empty-state" id="empty-state" style="display: none;">
        <div class="empty-icon">✅</div>
        <div class="empty-text">延滞者はいません</div>
      </div>
    </div>

    <div id="message"></div>
  </main>

  <script>
    // ページ読み込み時に自動で検索
    document.addEventListener('DOMContentLoaded', function() {
      searchOverdue();
    });

    // 延滞者を検索する関数
    function searchOverdue() {
      const filter = document.getElementById('overdue-filter').value;
      showMessage('延滞者を検索中...', '');

      google.script.run
        .withSuccessHandler(function(result) {
          displayOverdueList(result, filter);
          showMessage('', '');
        })
        .withFailureHandler(function(error) {
          showMessage('検索中にエラーが発生しました: ' + error.message, 'error');
        })
        .getOverdueList();
    }

    // 延滞者リストを表示する関数
    function displayOverdueList(overdueList, filter) {
      const listSection = document.getElementById('list-section');
      const tableBody = document.getElementById('table-body');
      const emptyState = document.getElementById('empty-state');
      const summaryText = document.getElementById('summary-text');

      // フィルタリング
      let filteredList = overdueList;
      if (filter !== 'all') {
        const days = parseInt(filter);
        filteredList = overdueList.filter(item => item.overdueDays >= days);
      }

      listSection.style.display = 'block';

      if (filteredList.length === 0) {
        tableBody.parentElement.style.display = 'none';
        emptyState.style.display = 'block';
        summaryText.textContent = '現在、延滞者はいません';
      } else {
        tableBody.parentElement.style.display = 'table';
        emptyState.style.display = 'none';

        // サマリー更新
        const totalCount = filteredList.length;
        const maxDays = Math.max(...filteredList.map(item => item.overdueDays));
        summaryText.textContent = `延滞件数: ${totalCount}件　最大延滞日数: ${maxDays}日`;

        // テーブル更新
        tableBody.innerHTML = '';
        filteredList.forEach(item => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td class="mono">${escapeHtml(item.userId)}</td>
            <td class="user-name">${escapeHtml(item.userName)}</td>
            <td class="mono">${escapeHtml(item.bookId)}</td>
            <td class="book-title">${escapeHtml(item.bookTitle)}</td>
            <td>${formatDate(item.lendingDate)}</td>
            <td>${formatDate(item.dueDate)}</td>
            <td><span class="badge badge-danger">${item.overdueDays}日</span></td>
          `;
          tableBody.appendChild(row);
        });
      }
    }

    // レポートを出力する関数
    function exportToSheet() {
      showMessage('レポートを作成中...', '');

      google.script.run
        .withSuccessHandler(function(result) {
          showMessage('延滞者レポートを作成しました', '');
        })
        .withFailureHandler(function(error) {
          showMessage('レポート作成中にエラーが発生しました: ' + error.message, 'error');
        })
        .createOverdueReport();
    }

    // メッセージを表示する関数
    function showMessage(message, type) {
      const messageEl = document.getElementById('message');
      messageEl.textContent = message;
      messageEl.className = type;

      if (type !== 'error' && message === '') {
        setTimeout(function() {
          messageEl.textContent = '';
          messageEl.className = '';
        }, 3000);
      }
    }

    // HTMLエスケープ関数
    function escapeHtml(unsafe) {
      if (!unsafe) return '';
      return unsafe
        .toString()
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // 日付フォーマット関数
    function formatDate(dateString) {
      if (!dateString) return '';
      const date = new Date(dateString);
      return date.toLocaleDateString('ja-JP', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      });
    }
  </script>

  <script>
    // WebアプリのURLはテンプレート評価時にサーバー側で埋め込まれる(往復なしで即時設定)
    (function() {
      const url = '<?!= getWebAppUrl(); ?>';
      document.querySelectorAll('.js-menu-link').forEach(el => { el.href = url; });
    })();
  </script>
</body>
</html>
