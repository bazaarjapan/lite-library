<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>書籍在庫管理</title>
  <?!= includeHtml_('common_styles'); ?>
  <style>
    /* ページ固有: サマリーカードのグリッドとフィルター行 */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.625rem;
      margin-bottom: 1rem;
    }
    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 0.75rem;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .summary-value {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .summary-label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .filter-row {
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .filter-row .field { flex: 1 1 14rem; margin-bottom: 0; }
    .list-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }
    .list-head .card-title { margin: 0; }
    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
    }
    .empty-icon { font-size: 2rem; opacity: 0.6; }
    .empty-text { font-weight: 700; }
  </style>
</head>
<body>
  <header class="app-header">
    <a href="#" class="app-header-back js-menu-link">← メニュー</a>
    <span class="app-header-title"><span class="group-dot manage"></span>書籍在庫管理</span>
  </header>

  <main class="app-main wide">
    <!-- サマリーカード -->
    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-value" id="total-books">-</div>
        <div class="summary-label">総蔵書数</div>
      </div>

      <div class="summary-card">
        <div class="summary-value" id="available-books">-</div>
        <div class="summary-label">貸出可能</div>
      </div>

      <div class="summary-card">
        <div class="summary-value" id="borrowed-books">-</div>
        <div class="summary-label">貸出中</div>
      </div>
    </div>

    <!-- フィルター部分 -->
    <div class="card">
      <h2 class="card-title">絞り込み</h2>
      <div class="filter-row">
        <div class="field">
          <label for="search-text">書籍検索（管理番号/ISBN/タイトル）</label>
          <input type="text" id="search-text" placeholder="管理番号、ISBNまたはタイトルを入力">
        </div>
        <div class="field">
          <label for="status-filter">状態</label>
          <select id="status-filter">
            <option value="">すべて</option>
            <option value="available">貸出可能</option>
            <option value="borrowed">貸出中</option>
            <option value="discarded">廃棄</option>
          </select>
        </div>
        <button class="btn-primary" onclick="loadInventory()">検索</button>
      </div>
    </div>

    <!-- 在庫テーブル -->
    <div class="card">
      <div class="list-head">
        <h2 class="card-title">書籍在庫一覧</h2>
        <button onclick="exportInventory()">📊 エクスポート</button>
      </div>

      <div class="table-wrap">
        <table id="inventory-table">
          <thead>
            <tr>
              <th>管理番号</th>
              <th>ISBN</th>
              <th>書籍名</th>
              <th>著者</th>
              <th>出版社</th>
              <th>状態</th>
              <th>貸出者</th>
              <th>返却予定日</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>

      <div class="empty-state" id="empty-state" style="display: none;">
        <div class="empty-icon">📚</div>
        <div class="empty-text">検索条件に一致する書籍がありません</div>
      </div>
    </div>

    <div id="message"></div>
  </main>

  <script>
    let inventoryData = [];

    // ページ読み込み時に在庫データを取得
    document.addEventListener('DOMContentLoaded', function() {
      loadInventory();
    });

    // 在庫データを読み込む関数
    function loadInventory() {
      const searchText = document.getElementById('search-text').value.trim();
      const statusFilter = document.getElementById('status-filter').value;

      showMessage('在庫データを読み込み中...', '');

      google.script.run
        .withSuccessHandler(function(data) {
          inventoryData = data;
          displayInventory(data, searchText, statusFilter);
          showMessage('', '');
        })
        .withFailureHandler(function(error) {
          showMessage('在庫データの読み込みに失敗しました: ' + error.message, 'error');
        })
        .getBookInventory();
    }

    // 在庫データを表示する関数
    function displayInventory(data, searchText, statusFilter) {
      // フィルタリング
      let filteredData = data;

      if (searchText) {
        filteredData = filteredData.filter(book =>
          book.managementNumber.toLowerCase().includes(searchText.toLowerCase()) ||
          book.isbn.toLowerCase().includes(searchText.toLowerCase()) ||
          book.title.toLowerCase().includes(searchText.toLowerCase())
        );
      }

      if (statusFilter) {
        filteredData = filteredData.filter(book => toStatusKey(book.status) === statusFilter);
      }

      // サマリー更新
      updateSummary(data);

      // テーブル更新
      const tableBody = document.getElementById('table-body');
      const emptyState = document.getElementById('empty-state');
      const table = document.getElementById('inventory-table');

      if (filteredData.length === 0) {
        table.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }

      table.style.display = 'table';
      emptyState.style.display = 'none';

      tableBody.innerHTML = '';
      filteredData.forEach(book => {
        const row = document.createElement('tr');

        let statusClass = 'badge badge-muted';
        let statusText = book.status || '';
        const statusKey = toStatusKey(book.status);
        if (statusKey === 'available') {
          statusClass = 'badge badge-ok';
          statusText = '貸出可能';
        } else if (statusKey === 'borrowed') {
          statusClass = 'badge badge-warn';
          statusText = '貸出中';
        } else if (statusKey === 'discarded') {
          statusClass = 'badge badge-muted';
          statusText = '廃棄';
        }

        row.innerHTML = `
          <td class="mono">${escapeHtml(book.managementNumber || book.bookId)}</td>
          <td class="mono">${escapeHtml(book.isbn || book.bookId)}</td>
          <td>${escapeHtml(book.title)}</td>
          <td>${escapeHtml(book.author)}</td>
          <td>${escapeHtml(book.publisher)}</td>
          <td><span class="${statusClass}">${statusText}</span></td>
          <td>${book.borrowerName || '-'}</td>
          <td>${book.dueDate ? formatDate(book.dueDate) : '-'}</td>
          <td>
            <div class="action-buttons">
              <button class="action-button edit-button" onclick="editBook('${escapeHtml(book.managementNumber || book.bookId)}')">編集</button>
            </div>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    // サーバーの状態値(在庫/貸出中/廃棄)を表示・絞り込み用のキーに正規化する関数
    function toStatusKey(status) {
      if (status === 'available' || status === '在庫') return 'available';
      if (status === 'borrowed' || status === '貸出中') return 'borrowed';
      if (status === 'discarded' || status === '廃棄') return 'discarded';
      return status || '';
    }

    // サマリーを更新する関数(廃棄済みは総蔵書数に含めない)
    function updateSummary(data) {
      const totalBooks = data.filter(book => toStatusKey(book.status) !== 'discarded').length;
      const availableBooks = data.filter(book => toStatusKey(book.status) === 'available').length;
      const borrowedBooks = data.filter(book => toStatusKey(book.status) === 'borrowed').length;

      document.getElementById('total-books').textContent = totalBooks;
      document.getElementById('available-books').textContent = availableBooks;
      document.getElementById('borrowed-books').textContent = borrowedBooks;
    }

    // 書籍を編集する関数
    function editBook(bookId) {
      showMessage(`書籍編集機能は次回実装予定です（書籍ID: ${bookId}）`, '');
    }

    // 在庫リストをエクスポートする関数
    function exportInventory() {
      showMessage('在庫リストを作成中...', '');

      google.script.run
        .withSuccessHandler(function(result) {
          showMessage('在庫リストを作成しました', 'success');
        })
        .withFailureHandler(function(error) {
          showMessage('エクスポート中にエラーが発生しました: ' + error.message, 'error');
        })
        .createInventoryReport();
    }

    // メッセージを表示する関数
    function showMessage(message, type) {
      const messageEl = document.getElementById('message');
      messageEl.textContent = message;
      messageEl.className = type;

      if (type === 'success' || (type !== 'error' && message === '')) {
        setTimeout(function() {
          messageEl.textContent = '';
          messageEl.className = '';
        }, 3000);
      }
    }

    // HTMLエスケープ関数
    function escapeHtml(unsafe) {
      if (!unsafe) return '';
      return unsafe
        .toString()
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // 日付フォーマット関数
    function formatDate(dateString) {
      if (!dateString) return '';
      const date = new Date(dateString);
      return date.toLocaleDateString('ja-JP', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      });
    }
  </script>

  <script>
    // WebアプリのURLはテンプレート評価時にサーバー側で埋め込まれる(往復なしで即時設定)
    (function() {
      const url = '<?!= getWebAppUrl(); ?>';
      document.querySelectorAll('.js-menu-link').forEach(el => { el.href = url; });
    })();
  </script>
</body>
</html>
