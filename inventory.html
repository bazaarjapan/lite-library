<body>
  <div class="menu-button-container"><a href="#" class="menu-button" id="menu-button-top">← メニューに戻る</a></div>
  <div class="container">
    <h1>書籍在庫管理</h1>
    
    <!-- サマリーカード -->
    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-icon">📚</div>
        <div class="summary-value" id="total-books">-</div>
        <div class="summary-label">総蔵書数</div>
      </div>
      
      <div class="summary-card">
        <div class="summary-icon">✅</div>
        <div class="summary-value" id="available-books">-</div>
        <div class="summary-label">貸出可能</div>
      </div>
      
      <div class="summary-card">
        <div class="summary-icon">📖</div>
        <div class="summary-value" id="borrowed-books">-</div>
        <div class="summary-label">貸出中</div>
      </div>
    </div>
    
    <!-- フィルター部分 -->
    <div class="filter-section">
      <div class="filter-row">
        <div class="filter-item">
          <label for="search-text">書籍検索（管理番号/ISBN/タイトル）</label>
          <input type="text" id="search-text" placeholder="管理番号、ISBNまたはタイトルを入力">
        </div>
        <div class="filter-item">
          <label for="status-filter">状態</label>
          <select id="status-filter">
            <option value="">すべて</option>
            <option value="available">貸出可能</option>
            <option value="borrowed">貸出中</option>
          </select>
        </div>
        <div>
          <button class="search-button" onclick="loadInventory()">🔍 検索</button>
        </div>
      </div>
    </div>
    
    <!-- 在庫テーブル -->
    <div class="inventory-section">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <h2 style="margin: 0; font-size: 54px; color: #8b6f4e;">書籍在庫一覧</h2>
        <button class="export-button" onclick="exportInventory()">📊 在庫リストをエクスポート</button>
      </div>
      
      <div class="table-container">
        <table id="inventory-table">
          <thead>
            <tr>
              <th>管理番号</th>
              <th>ISBN</th>
              <th>書籍名</th>
              <th>著者</th>
              <th>出版社</th>
              <th>状態</th>
              <th>貸出者</th>
              <th>返却予定日</th>
              <th style="width: 200px;">操作</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
      
      <div class="empty-state" id="empty-state" style="display: none;">
        <div class="empty-icon">📚</div>
        <div class="empty-text">検索条件に一致する書籍がありません</div>
      </div>
    </div>
    
    <div id="message"></div>
  </div>
  
  <script>
    let inventoryData = [];
    
    // ページ読み込み時に在庫データを取得
    document.addEventListener('DOMContentLoaded', function() {
      loadInventory();
    });
    
    // 在庫データを読み込む関数
    function loadInventory() {
      const searchText = document.getElementById('search-text').value.trim();
      const statusFilter = document.getElementById('status-filter').value;
      
      showMessage('在庫データを読み込み中...', '');
      
      google.script.run
        .withSuccessHandler(function(data) {
          inventoryData = data;
          displayInventory(data, searchText, statusFilter);
          showMessage('', '');
        })
        .withFailureHandler(function(error) {
          showMessage('在庫データの読み込みに失敗しました: ' + error.message, 'error');
        })
        .getBookInventory();
    }
    
    // 在庫データを表示する関数
    function displayInventory(data, searchText, statusFilter) {
      // フィルタリング
      let filteredData = data;
      
      if (searchText) {
        filteredData = filteredData.filter(book => 
          book.managementNumber.toLowerCase().includes(searchText.toLowerCase()) ||
          book.isbn.toLowerCase().includes(searchText.toLowerCase()) ||
          book.title.toLowerCase().includes(searchText.toLowerCase())
        );
      }
      
      if (statusFilter) {
        filteredData = filteredData.filter(book => book.status === statusFilter);
      }
      
      // サマリー更新
      updateSummary(data);
      
      // テーブル更新
      const tableBody = document.getElementById('table-body');
      const emptyState = document.getElementById('empty-state');
      const table = document.getElementById('inventory-table');
      
      if (filteredData.length === 0) {
        table.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }
      
      table.style.display = 'table';
      emptyState.style.display = 'none';
      
      tableBody.innerHTML = '';
      filteredData.forEach(book => {
        const row = document.createElement('tr');
        
        let statusClass = '';
        let statusText = '';
        if (book.status === 'available' || book.status === '在庫') {
          statusClass = 'status-available';
          statusText = '貸出可能';
        } else if (book.status === 'borrowed' || book.status === '貸出中') {
          statusClass = 'status-borrowed';
          statusText = '貸出中';
        }
        
        row.innerHTML = `
          <td>${escapeHtml(book.managementNumber || book.bookId)}</td>
          <td>${escapeHtml(book.isbn || book.bookId)}</td>
          <td>${escapeHtml(book.title)}</td>
          <td>${escapeHtml(book.author)}</td>
          <td>${escapeHtml(book.publisher)}</td>
          <td class="${statusClass}">${statusText}</td>
          <td>${book.borrowerName || '-'}</td>
          <td>${book.dueDate ? formatDate(book.dueDate) : '-'}</td>
          <td>
            <div class="action-buttons">
              <button class="action-button edit-button" onclick="editBook('${escapeHtml(book.managementNumber || book.bookId)}')">編集</button>
            </div>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }
    
    // サマリーを更新する関数
    function updateSummary(data) {
      const totalBooks = data.length;
      const availableBooks = data.filter(book => book.status === 'available' || book.status === '在庫').length;
      const borrowedBooks = data.filter(book => book.status === 'borrowed' || book.status === '貸出中').length;
      
      document.getElementById('total-books').textContent = totalBooks;
      document.getElementById('available-books').textContent = availableBooks;
      document.getElementById('borrowed-books').textContent = borrowedBooks;
    }
    
    // 書籍を編集する関数
    function editBook(bookId) {
      showMessage(`書籍編集機能は次回実装予定です（書籍ID: ${bookId}）`, '');
    }
    
    // 在庫リストをエクスポートする関数
    function exportInventory() {
      showMessage('在庫リストを作成中...', '');
      
      google.script.run
        .withSuccessHandler(function(result) {
          showMessage('在庫リストを作成しました', 'success');
        })
        .withFailureHandler(function(error) {
          showMessage('エクスポート中にエラーが発生しました: ' + error.message, 'error');
        })
        .createInventoryReport();
    }
    
    // メッセージを表示する関数
    function showMessage(message, type) {
      const messageEl = document.getElementById('message');
      messageEl.textContent = message;
      messageEl.className = type;
      
      if (type === 'success' || (type !== 'error' && message === '')) {
        setTimeout(function() {
          messageEl.textContent = '';
          messageEl.className = '';
        }, 3000);
      }
    }
    
    // HTMLエスケープ関数
    function escapeHtml(unsafe) {
      if (!unsafe) return '';
      return unsafe
        .toString()
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
    
    // 日付フォーマット関数
    function formatDate(dateString) {
      if (!dateString) return '';
      const date = new Date(dateString);
      return date.toLocaleDateString('ja-JP', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      });
    }
  </script>
  
  <div class="menu-button-container"><a href="#" class="menu-button" id="menu-button-bottom">← メニューに戻る</a></div>

    // WebアプリのURLはテンプレート評価時にサーバー側で埋め込まれる(往復なしで即時設定)
    (function() {
      const url = '<?!= getWebAppUrl(); ?>';
      document.getElementById('menu-button-top').href = url;
      document.getElementById('menu-button-bottom').href = url;
    })();
  </script>
