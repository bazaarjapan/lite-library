  <!-- バーコードはクライアント側でSVG生成する(外部画像APIに依存しない) -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: linear-gradient(135deg, #f5f1e8 0%, #e8dfd2 100%);

    .container {

      min-height: 100vh;

    h1 {
      font-size: 84px;
      text-align: center;
      color: #8b6f4e;
      font-family: 'Noto Serif JP', serif;
      margin: 0 0 60px 0;
      padding-bottom: 40px;
      border-bottom: 6px solid #d4af37;
    }
    h1::before { content: "🏷️"; display: block; font-size: 96px; margin-bottom: 20px; }
    .form-group { margin-bottom: 60px; }
    label { display: block; font-weight: bold; color: #8b6f4e; margin-bottom: 20px; }
    select, input[type="text"], input[type="number"] {
      font-size: 48px;

    .controls-row > div { flex: 1; min-width: 300px; }

      font-size: 48px;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #8b6f4e 0%, #6d5640 100%);
      border: none;
      border-radius: 20px;
      padding: 35px 60px;
      cursor: pointer;
      margin: 10px 10px 10px 0;
    }
    button.secondary { background: linear-gradient(135deg, #6c757d 0%, #495057 100%); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #item-list {
      max-height: 900px;

    /* PC・iPad(1024px以上): 2カラム(左=条件、右=一覧) */
    @media (min-width: 1024px) {
      .container {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        column-gap: 60px;
        align-items: start;

      .container > h1 { grid-column: 1 / -1; }
      .container > .form-group { grid-column: 1; }
      .container > #list-section { grid-column: 2; grid-row: 2 / span 4; min-width: 0; }
      .container > #message { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <div class="menu-button-container">
    <a href="#" class="menu-button" id="menu-button-top">← メニューに戻る</a>
  </div>
  <div class="container">
    <h1>バーコードラベル印刷</h1>

    <div class="form-group">
      <label for="target-type">対象</label>
      <select id="target-type">
        <option value="books">書籍(管理番号ラベル)</option>
        <option value="users">利用者(利用者IDラベル)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="filter-text">絞り込み(ID・名称の部分一致)</label>
      <input type="text" id="filter-text" placeholder="空欄で全件">
    </div>

    <div class="form-group">
      <div class="controls-row">
        <div>
          <label for="paper-preset">ラベル用紙</label>
          <select id="paper-preset">
            <option value="44">A4 44面 (48.3×25.4mm・4列)</option>
            <option value="65">A4 65面 (38.1×21.2mm・5列)</option>
            <option value="24">A4 24面 (70×33.9mm・3列)</option>
          </select>
        </div>
        <div>
          <label for="start-position">開始位置(使いかけ用紙の続きから)</label>
          <input type="number" id="start-position" value="1" min="1">
        </div>
      </div>
    </div>

    <div class="form-group">
      <button id="select-all-button" class="secondary">全選択/解除</button>
      <button id="print-button">🖨️ 選択したラベルを印刷</button>
    </div>

    <div class="form-group" id="list-section">
      <label>ラベル対象(チェックしたものを印刷)</label>
      <div id="item-list">読み込み中...</div>
    </div>

    <p id="message"></p>
  </div>

  <div class="menu-button-container">
    <a href="#" class="menu-button" id="menu-button-bottom">← メニューに戻る</a>
  </div>

  <script>
    let items = []; // {id, label}
    let selectedIds = new Set(); // 絞り込みや再描画をまたいで選択状態を保持する

    // ラベル用紙プリセット(A4 210×297mm)
    const PAPER_PRESETS = {
      "44": { cols: 4, rows: 11, width: 48.3, height: 25.4, marginTop: 8.8, marginLeft: 8.4 },
      "65": { cols: 5, rows: 13, width: 38.1, height: 21.2, marginTop: 10.7, marginLeft: 9.75 },
      "24": { cols: 3, rows: 8, width: 70, height: 33.9, marginTop: 12.9, marginLeft: 0 }
    };

    function setMessage(msg) {
      document.getElementById('message').innerText = msg;
    }

    function loadItems() {
      const type = document.getElementById('target-type').value;
      document.getElementById('item-list').textContent = '読み込み中...';
      setMessage('');
      google.script.run
        .withSuccessHandler(function(result) {
          items = result || [];
          selectedIds = new Set(items.map(item => item.id)); // 初期状態は全選択
          renderList();
          setMessage(items.length + '件を読み込みました。');
        })
        .withFailureHandler(function(error) {
          document.getElementById('item-list').textContent = '';
          setMessage('読み込みに失敗しました: ' + error.message);
        })
        .getLabelItems(type);
    }

    function getFilteredItems() {
      const filter = document.getElementById('filter-text').value.trim().toLowerCase();
      if (!filter) return items;
      return items.filter(item =>
        item.id.toLowerCase().includes(filter) ||
        (item.label || '').toLowerCase().includes(filter));
    }

    function renderList() {
      const listEl = document.getElementById('item-list');
      const filtered = getFilteredItems();
      if (filtered.length === 0) {
        listEl.textContent = '対象がありません。';
        return;
      }
      listEl.innerHTML = '';
      filtered.forEach(item => {
        const row = document.createElement('div');
        row.className = 'item-row';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = selectedIds.has(item.id);
        checkbox.dataset.id = item.id;
        checkbox.addEventListener('change', function() {
          if (this.checked) selectedIds.add(item.id);
          else selectedIds.delete(item.id);
        });
        const idSpan = document.createElement('span');
        idSpan.className = 'item-id';
        idSpan.textContent = item.id;
        const nameSpan = document.createElement('span');
        nameSpan.className = 'item-name';
        nameSpan.textContent = item.label || '';
        row.appendChild(checkbox);
        row.appendChild(idSpan);
        row.appendChild(nameSpan);
        listEl.appendChild(row);
      });
    }

    // 選択された項目のバーコードSVGを生成する(Code128)
    function makeBarcodeSvg(value) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      JsBarcode(svg, value, { format: 'CODE128', displayValue: false, margin: 0, height: 40, width: 2 });
      return svg;
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, function(ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
      });
    }

    function printLabels() {
      if (typeof JsBarcode === 'undefined') {
        setMessage('バーコード生成ライブラリを読み込めませんでした。通信状態を確認して再読み込みしてください。');
        return;
      }
      // 絞り込み表示中でも選択済みの全項目を印刷対象にする(選択状態はSetで保持)
      const selected = items.filter(item => selectedIds.has(item.id));
      if (selected.length === 0) {
        setMessage('印刷するラベルにチェックを入れてください。');
        return;
      }

      const preset = PAPER_PRESETS[document.getElementById('paper-preset').value];
      const perSheet = preset.cols * preset.rows;
      const startPosition = Math.max(1, parseInt(document.getElementById('start-position').value, 10) || 1);
      const offset = (startPosition - 1) % perSheet;

      // セルHTMLを作成(先頭に開始位置分の空セルを入れる)
      const cells = [];
      for (let i = 0; i < offset; i++) {
        cells.push('<div class="cell"></div>');
      }
      selected.forEach(item => {
        let svgHtml = '';
        try {
          svgHtml = makeBarcodeSvg(item.id).outerHTML;
        } catch (e) {
          svgHtml = '<div class="error">生成不可</div>';
        }
        cells.push(
          '<div class="cell">' + svgHtml +
          '<div class="id">' + escapeHtml(item.id) + '</div>' +
          '<div class="name">' + escapeHtml(item.label) + '</div></div>'
        );
      });

      // シート単位に分割
      const sheets = [];
      for (let i = 0; i < cells.length; i += perSheet) {
        sheets.push('<div class="sheet">' + cells.slice(i, i + perSheet).join('') + '</div>');
      }

      const printHtml = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>ラベル印刷</title><style>' +
        '@page { size: A4; margin: 0; }' +
        'body { margin: 0; font-family: "Noto Sans JP", sans-serif; }' +
        '.sheet { width: 210mm; height: 297mm; box-sizing: border-box;' +
        ' padding: ' + preset.marginTop + 'mm ' + preset.marginLeft + 'mm;' +
        ' display: grid; grid-template-columns: repeat(' + preset.cols + ', ' + preset.width + 'mm);' +
        ' grid-auto-rows: ' + preset.height + 'mm; page-break-after: always; }' +
        '.cell { box-sizing: border-box; padding: 1.5mm; overflow: hidden; text-align: center; }' +
        '.cell svg { width: 100%; height: 52%; }' +
        '.cell .id { font-family: monospace; font-size: 7pt; line-height: 1.2; }' +
        '.cell .name { font-size: 6.5pt; line-height: 1.2; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }' +
        '</style></head><body>' + sheets.join('') + '</body></html>';

      const popup = window.open('', '_blank', 'width=900,height=1000');
      if (!popup) {
        setMessage('印刷用ウィンドウを開けませんでした。ポップアップを許可してください。');
        return;
      }
      popup.document.open();
      popup.document.write(printHtml);
      popup.document.close();
      popup.focus();
      setTimeout(function() { popup.print(); }, 500);
      setMessage(selected.length + '件のラベルを印刷用ウィンドウに出力しました(' + sheets.length + '枚)。');
    }

    document.getElementById('target-type').addEventListener('change', loadItems);
    document.getElementById('filter-text').addEventListener('input', renderList);
    document.getElementById('select-all-button').addEventListener('click', function() {
      // 絞り込み表示中の項目を対象にトグルする(全選択済みなら解除、そうでなければ全選択)
      const filtered = getFilteredItems();
      const allSelected = filtered.length > 0 && filtered.every(item => selectedIds.has(item.id));
      filtered.forEach(item => {
        if (allSelected) selectedIds.delete(item.id);
        else selectedIds.add(item.id);
      });
      renderList();
    });
    document.getElementById('print-button').addEventListener('click', printLabels);

    loadItems();
  </script>

    // WebアプリのURLはテンプレート評価時にサーバー側で埋め込まれる(往復なしで即時設定)

      document.getElementById('menu-button-bottom').href = url;

  </script>
</body>
