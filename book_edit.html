<!DOCTYPE html>
<html>
<head>

  <style>
    /* ページ固有: 2列フォーム行・読み取り専用値・現在の状態・履歴統計・削除確認モーダル */
    .info-row {
      display: grid;
      grid-template-columns: 1fr;
      column-gap: 0.75rem;
    }
    @media (min-width: 640px) {
      .info-row { grid-template-columns: 1fr 1fr; }
    }
    .info-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }
    .info-value {
      font-size: 0.95rem;
      font-weight: 700;
      padding: 0.5rem 0.75rem;
      background: var(--bg);
      border-radius: var(--radius);
      margin-bottom: 0.875rem;
    }

    textarea { min-height: 5rem; resize: vertical; }

    .history-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.625rem;
      margin-bottom: 1rem;
    }
    .stat-card {
      background: var(--bg);
      border-radius: var(--radius);
      padding: 0.75rem 0.5rem;
      text-align: center;
    }
    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.3;
    }
    .stat-label {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* 現在の状態(#book-status にJSが status-available / status-borrowed を付与する) */
    .current-status {
      background: var(--bg);
      border-radius: var(--radius);
      padding: 0.75rem;
      margin-bottom: 0.875rem;
      text-align: center;
    }
    .status-available { color: var(--success); font-weight: 700; }
    .status-borrowed { color: var(--danger); font-weight: 700; }
    .status-returned { color: var(--success); font-weight: 700; }
    .status-not-returned { color: var(--danger); font-weight: 700; }

    /* 削除確認モーダル(表示切替はJSがstyle.displayで行う) */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(16, 24, 32, 0.5);
    }
    .modal-content {
      background: var(--surface);
      margin: 20vh auto 0;
      padding: 1.5rem;
      width: calc(100% - 2rem);
      max-width: 26rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 10px 40px rgba(16, 24, 32, 0.25);
      text-align: center;
    }
    .modal-title {
      margin: 0 0 0.75rem;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--danger);
    }
    .modal-text {
      margin: 0 0 1.25rem;
      font-size: 0.95rem;
      color: var(--text);
    }
    .modal-buttons {
      display: flex;
      gap: 0.625rem;
      justify-content: center;
    }
    .modal-buttons button { flex: 1 1 0; }
  </style>
</head>
<body>
  <header class="app-header">
    <a href="#" class="app-header-back js-menu-link">← メニュー</a>
    <span class="app-header-title"><span class="group-dot manage"></span>書籍情報編集</span>
  </header>

  <main class="app-main wide">
    <div class="two-col">
      <div>
        <!-- 書籍検索 -->
        <div class="card">
          <h2 class="card-title">書籍検索</h2>
          <form onsubmit="searchBook(event)">
            <div class="field">
              <label for="book-id">書籍ID (ISBN/バーコード)</label>
              <div class="input-row">
                <input type="text" id="book-id" placeholder="書籍IDを入力" required>
                <button type="submit" class="btn-primary">検索</button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <div>
        <!-- 書籍情報編集 -->
        <div class="card" id="book-info-section" style="display: none;">
          <h2 class="card-title">書籍情報 <span class="mono text-muted" id="display-book-id"></span></h2>

          <!-- 現在の状態 -->
          <div class="current-status" id="current-status">
            <div class="info-label">現在の状態</div>
            <div class="stat-value" id="book-status">-</div>
          </div>

          <form onsubmit="saveBook(event)">
            <div class="info-row">
              <div class="field">
                <label for="book-title">書籍名</label>
                <input type="text" id="book-title" required>
              </div>
              <div class="field">
                <label for="book-author">著者名</label>
                <input type="text" id="book-author">
              </div>
            </div>

            <div class="info-row">
              <div class="field">
                <label for="book-publisher">出版社</label>
                <input type="text" id="book-publisher">
              </div>
              <div class="field">
                <label for="book-category">カテゴリー</label>
                <select id="book-category">
                  <option value="">未分類</option>
                  <option value="文学">文学</option>
                  <option value="小説">小説</option>
                  <option value="ビジネス">ビジネス</option>
                  <option value="技術書">技術書</option>
                  <option value="教育">教育</option>
                  <option value="児童書">児童書</option>
                  <option value="雑誌">雑誌</option>
                  <option value="その他">その他</option>
                </select>
              </div>
            </div>

            <div class="info-row">
              <div class="field">
                <label for="book-location">配架場所</label>
                <input type="text" id="book-location" placeholder="例: A-1-3">
              </div>
              <div class="field">
                <label for="book-note">備考</label>
                <textarea id="book-note" placeholder="特記事項があれば入力"></textarea>
              </div>
            </div>

            <div class="info-row">
              <div>
                <div class="info-label">登録日</div>
                <div class="info-value" id="registration-date">-</div>
              </div>
              <div>
                <div class="info-label">最終貸出日</div>
                <div class="info-value" id="last-lending-date">-</div>
              </div>
            </div>

            <div class="button-group">
              <button type="submit" class="btn-primary btn-lg btn-block">保存</button>
              <button type="button" class="btn-block" onclick="cancelEdit()">キャンセル</button>
              <button type="button" class="btn-danger-solid btn-block" onclick="confirmDelete()">削除</button>
            </div>
          </form>
        </div>
      </div>

      <!-- 貸出履歴 -->
      <div class="card span-2" id="history-section" style="display: none;">
        <h2 class="card-title">貸出履歴</h2>

        <div class="history-stats">
          <div class="stat-card">
            <div class="stat-value" id="total-lending">0</div>
            <div class="stat-label">累計貸出回数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="average-days">0</div>
            <div class="stat-label">平均貸出日数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="popular-rank">-</div>
            <div class="stat-label">人気順位</div>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>利用者ID</th>
                <th>利用者名</th>
                <th>貸出日</th>
                <th>返却日</th>
                <th>貸出日数</th>
              </tr>
            </thead>
            <tbody id="history-body"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="message"></div>
      <div class="bottom-menu-link">
        <a href="#" class="btn btn-block js-menu-link">← メニューに戻る</a>
      </div>
    </main>

  <!-- 削除確認モーダル -->
  <div id="deleteModal" class="modal">
    <div class="modal-content">
      <h3 class="modal-title">削除確認</h3>
      <p class="modal-text">この書籍を削除してもよろしいですか？<br>この操作は取り消せません。</p>
      <div class="modal-buttons">
        <button class="btn-danger-solid" onclick="deleteBook()">削除する</button>
        <button onclick="closeModal()">キャンセル</button>
      </div>
    </div>
  </div>

  <script>
    let currentBookData = null;

    // 書籍を検索する関数
    function searchBook(event) {
      event.preventDefault();
      const bookId = document.getElementById('book-id').value.trim();

      if (!bookId) return;

      showMessage('書籍情報を検索中...', '');

      google.script.run
        .withSuccessHandler(function(data) {
          if (data) {
            currentBookData = data;
            displayBookInfo(data);
            loadBookHistory(bookId);
            showMessage('', '');
          } else {
            showMessage('書籍が見つかりません', 'error');
            document.getElementById('book-info-section').style.display = 'none';
            document.getElementById('history-section').style.display = 'none';
          }
        })
        .withFailureHandler(function(error) {
          showMessage('検索中にエラーが発生しました: ' + error.message, 'error');
        })
        .getBookFullDetails(bookId);
    }

    // 書籍情報を表示する関数
    function displayBookInfo(data) {
      document.getElementById('book-info-section').style.display = 'block';
      document.getElementById('display-book-id').textContent = 'ID: ' + data.bookId;
      document.getElementById('book-title').value = data.title || '';
      document.getElementById('book-author').value = data.author || '';
      document.getElementById('book-publisher').value = data.publisher || '';
      document.getElementById('book-category').value = data.category || '';
      document.getElementById('book-location').value = data.location || '';
      document.getElementById('book-note').value = data.note || '';
      document.getElementById('registration-date').textContent = formatDate(data.registrationDate) || '-';
      document.getElementById('last-lending-date').textContent = formatDate(data.lastLendingDate) || '-';

      // 現在の状態を表示
      const statusEl = document.getElementById('book-status');
      if (data.status === '廃棄') {
        statusEl.textContent = '廃棄';
        statusEl.className = 'stat-value status-borrowed';
      } else if (data.isAvailable) {
        statusEl.textContent = '貸出可能';
        statusEl.className = 'stat-value status-available';
      } else {
        statusEl.textContent = '貸出中';
        statusEl.className = 'stat-value status-borrowed';
      }
    }

    // 書籍の貸出履歴を読み込む関数
    function loadBookHistory(bookId) {
      google.script.run
        .withSuccessHandler(function(history) {
          displayBookHistory(history);
        })
        .withFailureHandler(function(error) {
          console.error('履歴読み込みエラー:', error);
        })
        .getBookLendingHistory(bookId);
    }

    // 貸出履歴を表示する関数
    function displayBookHistory(history) {
      document.getElementById('history-section').style.display = 'block';

      // 統計情報の計算
      const totalLending = history.length;
      let totalDays = 0;
      let returnedCount = 0;

      history.forEach(record => {
        if (record.returnDate) {
          returnedCount++;
          const lendingDate = new Date(record.lendingDate);
          const returnDate = new Date(record.returnDate);
          const days = Math.ceil((returnDate - lendingDate) / (1000 * 60 * 60 * 24));
          totalDays += days;
        }
      });

      const averageDays = returnedCount > 0 ? Math.round(totalDays / returnedCount) : 0;

      document.getElementById('total-lending').textContent = totalLending;
      document.getElementById('average-days').textContent = averageDays;
      // 人気順位は別途計算が必要なため、今は「-」を表示
      document.getElementById('popular-rank').textContent = '-';

      // 履歴テーブル
      const tbody = document.getElementById('history-body');
      tbody.innerHTML = '';

      // 最新20件のみ表示
      const recentHistory = history.slice(0, 20);
      recentHistory.forEach(record => {
        const row = document.createElement('tr');

        const lendingDate = new Date(record.lendingDate);
        const returnDate = record.returnDate ? new Date(record.returnDate) : null;
        const days = returnDate ? Math.ceil((returnDate - lendingDate) / (1000 * 60 * 60 * 24)) : '-';

        row.innerHTML = `
          <td class="mono">${escapeHtml(record.userId)}</td>
          <td>${escapeHtml(record.userName)}</td>
          <td>${formatDate(record.lendingDate)}</td>
          <td>${record.returnDate ? formatDate(record.returnDate) : '-'}</td>
          <td>${days}日</td>
        `;
        tbody.appendChild(row);
      });
    }

    // 書籍情報を保存する関数
    function saveBook(event) {
      event.preventDefault();

      if (!currentBookData) return;

      const updatedData = {
        bookId: currentBookData.bookId,
        title: document.getElementById('book-title').value.trim(),
        author: document.getElementById('book-author').value.trim(),
        publisher: document.getElementById('book-publisher').value.trim(),
        category: document.getElementById('book-category').value,
        location: document.getElementById('book-location').value.trim(),
        note: document.getElementById('book-note').value.trim()
      };

      showMessage('保存中...', '');

      google.script.run
        .withSuccessHandler(function(result) {
          showMessage('書籍情報を更新しました', 'success');
          currentBookData = updatedData;
        })
        .withFailureHandler(function(error) {
          showMessage('保存中にエラーが発生しました: ' + error.message, 'error');
        })
        .updateBookInfo(updatedData);
    }

    // 編集をキャンセルする関数
    function cancelEdit() {
      if (currentBookData) {
        displayBookInfo(currentBookData);
      } else {
        document.getElementById('book-info-section').style.display = 'none';
        document.getElementById('history-section').style.display = 'none';
      }
    }

    // 削除確認を表示する関数
    function confirmDelete() {
      // 廃棄済みの書籍を重ねて削除しない
      if (currentBookData && currentBookData.status === '廃棄') {
        showMessage('この書籍は既に廃棄済みです', 'error');
        return;
      }
      // 貸出中の書籍は削除できないチェック
      if (currentBookData && !currentBookData.isAvailable) {
        showMessage('貸出中の書籍は削除できません', 'error');
        return;
      }
      document.getElementById('deleteModal').style.display = 'block';
    }

    // モーダルを閉じる関数
    function closeModal() {
      document.getElementById('deleteModal').style.display = 'none';
    }

    // 書籍を削除する関数
    function deleteBook() {
      if (!currentBookData) return;

      showMessage('削除中...', '');
      closeModal();

      google.script.run
        .withSuccessHandler(function(result) {
          showMessage('書籍を削除しました', 'success');
          setTimeout(function() {
            document.getElementById('book-info-section').style.display = 'none';
            document.getElementById('history-section').style.display = 'none';
            document.getElementById('book-id').value = '';
            currentBookData = null;
          }, 2000);
        })
        .withFailureHandler(function(error) {
          showMessage('削除中にエラーが発生しました: ' + error.message, 'error');
        })
        .deleteBook(currentBookData.bookId);
    }

    // メッセージを表示する関数
    function showMessage(message, type) {
      const messageEl = document.getElementById('message');
      messageEl.textContent = message;
      messageEl.className = type;

      if (type === 'success' || (type !== 'error' && message === '')) {
        setTimeout(function() {
          messageEl.textContent = '';
          messageEl.className = '';
        }, 3000);
      }
    }

    // HTMLエスケープ関数
    function escapeHtml(unsafe) {
      if (!unsafe) return '';
      return unsafe
        .toString()
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // 日付フォーマット関数
    function formatDate(dateString) {
      if (!dateString) return '';
      const date = new Date(dateString);
      return date.toLocaleDateString('ja-JP', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      });
    }

    // モーダル外クリックで閉じる
    window.onclick = function(event) {
      const modal = document.getElementById('deleteModal');
      if (event.target == modal) {
        closeModal();
      }
    }
  </script>

  <script>
    // WebアプリのURLはテンプレート評価時にサーバー側で埋め込まれる(往復なしで即時設定)
    (function() {
      const url = '<?!= getWebAppUrl(); ?>';
      document.querySelectorAll('.js-menu-link').forEach(el => { el.href = url; });
    })();
  </script>
