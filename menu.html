<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <title>図書館管理システム</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <?!= includeHtml_('common_styles'); ?>
  <style>
    /* メニュー固有: 業務グループ見出し付きのタイルグリッド */
    .menu-group { margin-bottom: 1.5rem; }
    .menu-group-title {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0 0 0.625rem;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.625rem;
    }
    @media (min-width: 768px) {
      .menu-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (min-width: 1024px) {
      .menu-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .menu-tile {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      min-height: 4rem;
      padding: 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      text-decoration: none;
      color: var(--text);
      box-shadow: var(--shadow);
    }
    .menu-tile:hover { border-color: var(--border-strong); background: #fbfcfc; }
    .menu-tile:active { transform: translateY(1px); }
    .menu-tile-icon { font-size: 1.375rem; flex-shrink: 0; }
    .menu-tile-text { min-width: 0; }
    .menu-tile-title { display: block; font-size: 0.95rem; font-weight: 700; line-height: 1.3; }
    .menu-tile-desc {
      display: block;
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.35;
      margin-top: 0.125rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* 本日の稼働状況ミニダッシュボード(読み込み成功時のみ表示) */
    #dashboard {
      display: none;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }
    .stat-tile {
      padding: 0.5rem 0.25rem;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .stat-value { font-size: 1.375rem; font-weight: 700; line-height: 1.2; }
    .stat-label { font-size: 0.72rem; color: var(--text-muted); }
    .stat-tile.alert { border-color: var(--danger); background: var(--danger-soft); }
    .stat-tile.alert .stat-value { color: var(--danger); }
  </style>
</head>
<body>
  <header class="app-header">
    <span class="app-header-title">📚 図書館管理システム</span>
  </header>

  <main class="app-main wide">
    <div id="dashboard">
      <div class="stat-tile">
        <div class="stat-value" id="stat-lent">-</div>
        <div class="stat-label">今日の貸出</div>
      </div>
      <div class="stat-tile">
        <div class="stat-value" id="stat-returned">-</div>
        <div class="stat-label">今日の返却</div>
      </div>
      <div class="stat-tile">
        <div class="stat-value" id="stat-active">-</div>
        <div class="stat-label">貸出中</div>
      </div>
      <div class="stat-tile" id="stat-overdue-tile">
        <div class="stat-value" id="stat-overdue">-</div>
        <div class="stat-label">延滞</div>
      </div>
    </div>
    <div id="menuContainer">
      <div class="loading">読み込み中...</div>
    </div>
  </main>

  <script>
    // WebアプリのURLはテンプレート評価時にサーバー側で埋め込まれる(往復なしで即時描画)
    const baseUrl = '<?!= getWebAppUrl(); ?>';

    // 業務グループごとにメニューを構成する(dotクラスは各ページヘッダーの色と呼応)
    const menuGroups = [
      {
        title: '貸出業務',
        dot: 'lending',
        items: [
          { page: 'checkout', icon: '📚', text: '図書貸出', desc: '書籍の貸出処理' },
          { page: 'return', icon: '📖', text: '図書返却', desc: '書籍の返却処理' },
          { page: 'user_returns', icon: '👤', text: '利用者別返却', desc: '利用者ごとの返却' },
          { page: 'search', icon: '📕', text: '蔵書検索', desc: '書名・著者・ISBNで探す' },
          { page: 'reservations', icon: '🔖', text: '予約管理', desc: '予約の確認・取消' },
          { page: 'finder', icon: '🔍', text: '貸出書籍検索', desc: '貸出中の書籍を検索' }
        ]
      },
      {
        title: '登録・管理',
        dot: 'manage',
        items: [
          { page: 'register', icon: '➕', text: '書籍登録', desc: '新しい書籍を登録' },
          { page: 'user_register', icon: '👥', text: '利用者登録', desc: '新規利用者を登録' },
          { page: 'card_issue', icon: '🎫', text: '図書カード発行', desc: '利用者カードを発行' },
          { page: 'labels', icon: '🏷️', text: 'ラベル印刷', desc: 'バーコードラベルを印刷' },
          { page: 'user_edit', icon: '✏️', text: '利用者情報編集', desc: '利用者情報の変更・削除' },
          { page: 'book_edit', icon: '📝', text: '書籍情報編集', desc: '書籍情報の変更・削除' },
          { page: 'inventory', icon: '📦', text: '書籍在庫管理', desc: '蔵書の状態を確認' },
          { page: 'audit', icon: '✅', text: '棚卸し', desc: '棚の本をスキャンして点検' }
        ]
      },
      {
        title: 'レポート・設定',
        dot: 'report',
        items: [
          { page: 'history', icon: '📜', text: '貸出履歴検索', desc: '過去の貸出履歴を検索' },
          { page: 'overdue', icon: '⏰', text: '延滞者リスト', desc: '延滞中の書籍を確認' },
          { page: 'statistics', icon: '📊', text: '貸出統計', desc: '利用状況を分析' },
          { page: 'settings', icon: '⚙️', text: '図書館設定', desc: '貸出期間などの設定' }
        ]
      }
    ];

    let menuHtml = '';
    menuGroups.forEach(group => {
      menuHtml += `
        <section class="menu-group">
          <h2 class="menu-group-title"><span class="group-dot ${group.dot}"></span>${group.title}</h2>
          <div class="menu-grid">
      `;
      group.items.forEach(item => {
        menuHtml += `
          <a href="${baseUrl}?page=${item.page}" class="menu-tile">
            <span class="menu-tile-icon">${item.icon}</span>
            <span class="menu-tile-text">
              <span class="menu-tile-title">${item.text}</span>
              <span class="menu-tile-desc">${item.desc}</span>
            </span>
          </a>
        `;
      });
      menuHtml += `
          </div>
        </section>
      `;
    });

    document.getElementById('menuContainer').innerHTML = menuHtml;

    // 本日の稼働状況を非同期で読み込む(メニュー描画はブロックしない。
    // 取得失敗時はダッシュボードを表示しないだけで、メニューは通常どおり使える)
    google.script.run
      .withSuccessHandler(function(summary) {
        if (!summary || !summary.success) return;
        document.getElementById('stat-lent').textContent = summary.todayLent;
        document.getElementById('stat-returned').textContent = summary.todayReturned;
        document.getElementById('stat-active').textContent = summary.activeLoans;
        document.getElementById('stat-overdue').textContent = summary.overdue;
        if (summary.overdue > 0) {
          document.getElementById('stat-overdue-tile').classList.add('alert');
        }
        document.getElementById('dashboard').style.display = 'grid';
      })
      .withFailureHandler(function(error) {
        console.error('ダッシュボードの読み込みに失敗しました:', error);
      })
      .getDashboardSummary();
  </script>
</body>
</html>
