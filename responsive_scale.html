<style>
  /*
   * 共通レスポンシブ調整(includeHtml_('responsive_scale') で各ページのheadに読み込む)。
   * 各ページのスタイルはスマホ向けの大きなpx値で書かれているため、
   * 画面の広いデバイスではページ全体を縮小して等価なレイアウトを保つ。
   * メディアクエリは実ビューポート幅で評価されるので、各ページ内の
   * max-width系メディアクエリ(スマホ向け)には影響しない。
   */

  /*
   * min-height条件は、幅が768pxを超えるスマホ横向き(高さ約320〜430px)を
   * 除外するためのもの。iPadは横向きでも高さ744px以上なので対象のまま。
   * スマホ横向きで幅1024pxを超える機種は実質ないため、1024px以上の
   * ルールには付けない(PCで低いウィンドウでも縮小を維持する)。
   */

  /* iPad縦向きなどの中間サイズ */
  @media (min-width: 768px) and (max-width: 1023.98px) and (min-height: 500px) {
    body {
      zoom: 0.65;
    }
  }

  /* PC・iPad横向きなどの広い画面 */
  @media (min-width: 1024px) {
    body {
      zoom: 0.5;
    }
  }

  /*
   * 操作結果メッセージ(#message / #status-message)を画面上部に固定表示する。
   * 従来はページ最下部にあり、PCでは操作しても結果が画面外に表示され
   * 「何も起きていない」ように見えていた。空のときは表示しない。
   * 文字色は各ページのクラス(成功/エラー)をそのまま継承する。
   */
  #message:not(:empty),
  #status-message:not(.hidden):not(:empty) {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    /* スキャナーオーバーレイ(1000〜1002)や削除確認モーダル(1000)より下に置く */
    z-index: 900;
    margin: 0;
    padding: 24px 36px;
    background: rgba(255, 255, 253, 0.97);
    border-bottom: 4px solid #d4af37;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    text-align: center;
  }
</style>
