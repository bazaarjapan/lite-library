<html>
<head>

  <meta charset="utf-8">

  <style>
    /* ページ固有: 2列フォーム行・読み取り専用値・履歴統計・削除確認モーダル */
    .info-row {
      display: grid;
      grid-template-columns: 1fr;
      column-gap: 0.75rem;
    }
    @media (min-width: 640px) {
      .info-row { grid-template-columns: 1fr 1fr; }
    }
    .info-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }
    .info-value {
      font-size: 0.95rem;
      font-weight: 700;
      padding: 0.5rem 0.75rem;
      background: var(--bg);
      border-radius: var(--radius);
      margin-bottom: 0.875rem;
    }

    .history-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.625rem;
      margin-bottom: 1rem;
    }
    .stat-card {
      background: var(--bg);
      border-radius: var(--radius);
      padding: 0.75rem 0.5rem;
      text-align: center;
    }
    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.3;
    }
    .stat-label {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* 履歴テーブルの状態セル(JSがクラスを付与する) */
    .status-returned { color: var(--success); font-weight: 700; }
    .status-not-returned { color: var(--danger); font-weight: 700; }

    /* 削除確認モーダル(表示切替はJSがstyle.displayで行う) */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(16, 24, 32, 0.5);
    }
    .modal-content {
      background: var(--surface);
      margin: 20vh auto 0;
      padding: 1.5rem;
      width: calc(100% - 2rem);
      max-width: 26rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 10px 40px rgba(16, 24, 32, 0.25);
      text-align: center;
    }
    .modal-title {
      margin: 0 0 0.75rem;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--danger);
    }
    .modal-text {
      margin: 0 0 1.25rem;
      font-size: 0.95rem;
      color: var(--text);
    }
    .modal-buttons {
      display: flex;
      gap: 0.625rem;
      justify-content: center;
    }
    .modal-buttons button { flex: 1 1 0; }
  </style>
</head>
<body>
  <header class="app-header">
    <a href="#" class="app-header-back js-menu-link">← メニュー</a>
    <span class="app-header-title"><span class="group-dot manage"></span>利用者情報編集</span>
  </header>

  <main class="app-main wide">
    <div class="two-col">
      <div>
        <!-- 利用者検索 -->
        <div class="card">
          <h2 class="card-title">利用者検索</h2>
          <form onsubmit="searchUser(event)">
            <div class="field">
              <label for="user-id">利用者ID</label>
              <div class="input-row">
                <input type="text" id="user-id" placeholder="利用者IDを入力" required>
                <button type="submit" class="btn-primary">検索</button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <div>
        <!-- 利用者情報編集 -->
        <div class="card" id="user-info-section" style="display: none;">
          <h2 class="card-title">利用者情報 <span class="mono text-muted" id="display-user-id"></span></h2>

          <form onsubmit="saveUser(event)">
            <div class="info-row">
              <div class="field">
                <label for="user-name">氏名</label>
                <input type="text" id="user-name" required>
              </div>
              <div class="field">
                <label for="user-email">メールアドレス</label>
                <input type="email" id="user-email">
              </div>
            </div>

            <div class="info-row">
              <div class="field">
                <label for="user-phone">電話番号</label>
                <input type="tel" id="user-phone">
              </div>
              <div class="field">
                <label for="user-address">住所</label>
                <input type="text" id="user-address">
              </div>
            </div>

            <div class="info-row">
              <div>
                <div class="info-label">登録日</div>
                <div class="info-value" id="registration-date">-</div>
              </div>
              <div>
                <div class="info-label">最終利用日</div>
                <div class="info-value" id="last-use-date">-</div>
              </div>
            </div>

            <div class="button-group">
              <button type="submit" class="btn-primary btn-lg btn-block">保存</button>
              <button type="button" class="btn-block" onclick="cancelEdit()">キャンセル</button>
              <button type="button" class="btn-danger-solid btn-block" onclick="confirmDelete()">削除</button>
            </div>
          </form>
        </div>
      </div>

      <!-- 貸出履歴 -->
      <div class="card span-2" id="history-section" style="display: none;">
        <h2 class="card-title">貸出履歴</h2>

        <div class="history-stats">
          <div class="stat-card">
            <div class="stat-value" id="total-borrowed">0</div>
            <div class="stat-label">累計貸出数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="current-borrowed">0</div>
            <div class="stat-label">貸出中</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="overdue-count">0</div>
            <div class="stat-label">延滞中</div>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>書籍ID</th>
                <th>書籍名</th>
                <th>貸出日</th>
                <th>返却予定日</th>
                <th>状態</th>
              </tr>
            </thead>
            <tbody id="history-body"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="message"></div>
      <div class="bottom-menu-link">
        <a href="#" class="btn btn-block js-menu-link">← メニューに戻る</a>
      </div>
    </main>

  <!-- 削除確認モーダル -->
  <div id="deleteModal" class="modal">
    <div class="modal-content">
      <h3 class="modal-title">削除確認</h3>
      <p class="modal-text">この利用者を削除してもよろしいですか？<br>この操作は取り消せません。</p>
      <div class="modal-buttons">
        <button class="btn-danger-solid" onclick="deleteUser()">削除する</button>
        <button onclick="closeModal()">キャンセル</button>
      </div>
    </div>
  </div>

  <script>
    let currentUserData = null;

    // 利用者を検索する関数
    function searchUser(event) {
      event.preventDefault();
      const userId = document.getElementById('user-id').value.trim();

      if (!userId) return;

      showMessage('利用者情報を検索中...', '');

      google.script.run
        .withSuccessHandler(function(data) {
          console.log('検索結果:', data);
          console.log('データ型:', typeof data);
          console.log('JSON文字列:', JSON.stringify(data));
          if (data) {
            currentUserData = data;
            displayUserInfo(data);
            loadUserHistory(userId);
            showMessage('', '');
          } else {
            console.log('利用者が見つかりませんでした。入力されたID:', userId);
            showMessage('利用者が見つかりません。\n入力されたID: ' + userId, 'error');
            document.getElementById('user-info-section').style.display = 'none';
            document.getElementById('history-section').style.display = 'none';
          }
        })
        .withFailureHandler(function(error) {
          console.error('検索エラー:', error);
          showMessage('検索中にエラーが発生しました: ' + error.message, 'error');
        })
        .getUserDetails(userId);
    }

    // 利用者情報を表示する関数
    function displayUserInfo(data) {
      document.getElementById('user-info-section').style.display = 'block';
      document.getElementById('display-user-id').textContent = 'ID: ' + data.userId;
      document.getElementById('user-name').value = data.name || '';
      document.getElementById('user-email').value = data.email || '';
      document.getElementById('user-phone').value = data.phone || '';
      document.getElementById('user-address').value = data.address || '';
      document.getElementById('registration-date').textContent = formatDate(data.registrationDate) || '-';
      document.getElementById('last-use-date').textContent = formatDate(data.lastUseDate) || '-';
    }

    // 利用者の貸出履歴を読み込む関数
    function loadUserHistory(userId) {
      google.script.run
        .withSuccessHandler(function(history) {
          displayUserHistory(history);
        })
        .withFailureHandler(function(error) {
          console.error('履歴読み込みエラー:', error);
        })
        .getUserLendingHistory(userId);
    }

    // 貸出履歴を表示する関数
    function displayUserHistory(history) {
      document.getElementById('history-section').style.display = 'block';

      // 統計情報
      const totalBorrowed = history.length;
      const currentBorrowed = history.filter(h => h.status === '未返却').length;
      const overdueCount = history.filter(h => h.status === '未返却' && new Date(h.dueDate) < new Date()).length;

      document.getElementById('total-borrowed').textContent = totalBorrowed;
      document.getElementById('current-borrowed').textContent = currentBorrowed;
      document.getElementById('overdue-count').textContent = overdueCount;

      // 履歴テーブル
      const tbody = document.getElementById('history-body');
      tbody.innerHTML = '';

      // 最新20件のみ表示
      const recentHistory = history.slice(0, 20);
      recentHistory.forEach(record => {
        const row = document.createElement('tr');
        const statusClass = record.status === '返却済' ? 'status-returned' : 'status-not-returned';

        row.innerHTML = `
          <td class="mono">${escapeHtml(record.bookId)}</td>
          <td>${escapeHtml(record.bookTitle)}</td>
          <td>${formatDate(record.lendingDate)}</td>
          <td>${formatDate(record.dueDate)}</td>
          <td class="${statusClass}">${record.status}</td>
        `;
        tbody.appendChild(row);
      });
    }

    // 利用者情報を保存する関数
    function saveUser(event) {
      event.preventDefault();

      if (!currentUserData) return;

      const updatedData = {
        userId: currentUserData.userId,
        name: document.getElementById('user-name').value.trim(),
        email: document.getElementById('user-email').value.trim(),
        phone: document.getElementById('user-phone').value.trim(),
        address: document.getElementById('user-address').value.trim()
      };

      showMessage('保存中...', '');

      google.script.run
        .withSuccessHandler(function(result) {
          showMessage('利用者情報を更新しました', 'success');
          currentUserData = updatedData;
        })
        .withFailureHandler(function(error) {
          showMessage('保存中にエラーが発生しました: ' + error.message, 'error');
        })
        .updateUserInfo(updatedData);
    }

    // 編集をキャンセルする関数
    function cancelEdit() {
      if (currentUserData) {
        displayUserInfo(currentUserData);
      } else {
        document.getElementById('user-info-section').style.display = 'none';
        document.getElementById('history-section').style.display = 'none';
      }
    }

    // 削除確認を表示する関数
    function confirmDelete() {
      document.getElementById('deleteModal').style.display = 'block';
    }

    // モーダルを閉じる関数
    function closeModal() {
      document.getElementById('deleteModal').style.display = 'none';
    }

    // 利用者を削除する関数
    function deleteUser() {
      if (!currentUserData) return;

      showMessage('削除中...', '');
      closeModal();

      google.script.run
        .withSuccessHandler(function(result) {
          showMessage('利用者を削除しました', 'success');
          setTimeout(function() {
            document.getElementById('user-info-section').style.display = 'none';
            document.getElementById('history-section').style.display = 'none';
            document.getElementById('user-id').value = '';
            currentUserData = null;
          }, 2000);
        })
        .withFailureHandler(function(error) {
          showMessage('削除中にエラーが発生しました: ' + error.message, 'error');
        })
        .deleteUser(currentUserData.userId);
    }

    // メッセージを表示する関数
    function showMessage(message, type) {
      const messageEl = document.getElementById('message');
      messageEl.textContent = message;
      messageEl.className = type;

      if (type === 'success' || (type !== 'error' && message === '')) {
        setTimeout(function() {
          messageEl.textContent = '';
          messageEl.className = '';
        }, 3000);
      }
    }

    // HTMLエスケープ関数
    function escapeHtml(unsafe) {
      if (!unsafe) return '';
      return unsafe
        .toString()
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // 日付フォーマット関数
    function formatDate(dateString) {
      if (!dateString) return '';
      const date = new Date(dateString);
      return date.toLocaleDateString('ja-JP', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      });
    }


    // モーダル外クリックで閉じる
    window.onclick = function(event) {
      const modal = document.getElementById('deleteModal');
      if (event.target == modal) {
        closeModal();
      }
    }
  </script>

  <script>
    // WebアプリのURLはテンプレート評価時にサーバー側で埋め込まれる(往復なしで即時設定)
    (function() {
      const url = '<?!= getWebAppUrl(); ?>';
      document.querySelectorAll('.js-menu-link').forEach(el => { el.href = url; });
    })();
  </script>
