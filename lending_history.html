<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>貸出履歴検索</title>
  <?!= includeHtml_('common_styles'); ?>
  <style>
    /* ページ固有: 検索フォームの2列グリッドと結果セクション */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0 0.75rem;
    }
    @media (min-width: 640px) {
      .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .search-actions {
      display: flex;
      gap: 0.625rem;
    }
    .search-actions .btn-primary { flex: 1 1 auto; }
    #results-section { display: none; }
    .results-summary {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
    }
    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
    }
    .empty-icon { font-size: 2rem; opacity: 0.6; }
    .empty-text { font-weight: 700; }
    .export-row { text-align: center; margin-top: 1rem; }
  </style>
</head>
<body>
  <header class="app-header">
    <a href="#" class="app-header-back js-menu-link">← メニュー</a>
    <span class="app-header-title"><span class="group-dot report"></span>貸出履歴検索</span>
  </header>

  <main class="app-main wide">
    <!-- 検索部分 -->
    <div class="card">
      <h2 class="card-title">検索条件</h2>
      <div class="form-grid">
        <div class="field">
          <label for="book-id">書籍ID</label>
          <input type="text" id="book-id" placeholder="書籍IDを入力">
        </div>
        <div class="field">
          <label for="book-title">書籍名（部分一致）</label>
          <input type="text" id="book-title" placeholder="書籍名を入力">
        </div>
        <div class="field">
          <label for="user-id">利用者ID</label>
          <input type="text" id="user-id" placeholder="利用者IDを入力">
        </div>
        <div class="field">
          <label for="user-name">利用者名（部分一致）</label>
          <input type="text" id="user-name" placeholder="利用者名を入力">
        </div>
        <div class="field">
          <label for="date-from">貸出日（開始）</label>
          <input type="date" id="date-from">
        </div>
        <div class="field">
          <label for="date-to">貸出日（終了）</label>
          <input type="date" id="date-to">
        </div>
        <div class="field">
          <label for="status">返却状況</label>
          <select id="status">
            <option value="">すべて</option>
            <option value="未返却">未返却</option>
            <option value="返却済">返却済</option>
            <option value="延滞中">延滞中</option>
          </select>
        </div>
      </div>

      <div class="search-actions">
        <button class="btn-primary" onclick="searchHistory()">検索</button>
        <button onclick="clearSearch()">クリア</button>
      </div>
    </div>

    <!-- 検索結果 -->
    <div class="card" id="results-section">
      <h2 class="card-title">検索結果</h2>
      <div class="results-summary" id="results-summary"></div>

      <div class="table-wrap">
        <table id="results-table">
          <thead>
            <tr>
              <th>書籍ID</th>
              <th>書籍名</th>
              <th>利用者ID</th>
              <th>利用者名</th>
              <th>貸出日</th>
              <th>返却予定日</th>
              <th>返却日</th>
              <th>状態</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>

      <div class="empty-state" id="empty-state" style="display: none;">
        <div class="empty-icon">🔍</div>
        <div class="empty-text">検索条件に一致する履歴がありません</div>
      </div>

      <div class="export-row">
        <button onclick="exportHistory()">📊 検索結果をエクスポート</button>
      </div>
    </div>

    <div id="message"></div>
  </main>

  <script>
    let searchResults = [];

    // 検索を実行する関数
    function searchHistory() {
      const criteria = {
        bookId: document.getElementById('book-id').value.trim(),
        bookTitle: document.getElementById('book-title').value.trim(),
        userId: document.getElementById('user-id').value.trim(),
        userName: document.getElementById('user-name').value.trim(),
        dateFrom: document.getElementById('date-from').value,
        dateTo: document.getElementById('date-to').value,
        status: document.getElementById('status').value
      };

      showMessage('履歴を検索中...', '');

      google.script.run
        .withSuccessHandler(function(results) {
          searchResults = results;
          displayResults(results);
          showMessage('', '');
        })
        .withFailureHandler(function(error) {
          showMessage('検索中にエラーが発生しました: ' + error.message, 'error');
        })
        .searchLendingHistory(criteria);
    }

    // 検索結果を表示する関数
    function displayResults(results) {
      const resultsSection = document.getElementById('results-section');
      const resultsSummary = document.getElementById('results-summary');
      const tableBody = document.getElementById('table-body');
      const emptyState = document.getElementById('empty-state');
      const table = document.getElementById('results-table');

      resultsSection.style.display = 'block';

      if (results.length === 0) {
        resultsSummary.textContent = '';
        table.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }

      table.style.display = 'table';
      emptyState.style.display = 'none';

      // サマリー情報
      const notReturned = results.filter(r => r.status === '未返却').length;
      const overdue = results.filter(r => r.isOverdue).length;
      resultsSummary.textContent = `検索結果: ${results.length}件（未返却: ${notReturned}件、延滞中: ${overdue}件）`;

      // テーブルに結果を表示
      tableBody.innerHTML = '';
      results.forEach(record => {
        const row = document.createElement('tr');

        let statusClass = '';
        let statusText = record.status;
        if (record.status === '未返却') {
          if (record.isOverdue) {
            statusClass = 'badge badge-danger';
            statusText = '延滞中';
          } else {
            statusClass = 'badge badge-warn';
          }
        } else {
          statusClass = 'badge badge-ok';
        }

        row.innerHTML = `
          <td class="mono">${escapeHtml(record.bookId)}</td>
          <td>${escapeHtml(record.bookTitle)}</td>
          <td class="mono">${escapeHtml(record.userId)}</td>
          <td>${escapeHtml(record.userName)}</td>
          <td>${formatDate(record.lendingDate)}</td>
          <td>${formatDate(record.dueDate)}</td>
          <td>${record.returnDate ? formatDate(record.returnDate) : '-'}</td>
          <td><span class="${statusClass}">${statusText}</span></td>
        `;
        tableBody.appendChild(row);
      });
    }

    // 検索条件をクリアする関数
    function clearSearch() {
      document.getElementById('book-id').value = '';
      document.getElementById('book-title').value = '';
      document.getElementById('user-id').value = '';
      document.getElementById('user-name').value = '';
      document.getElementById('date-from').value = '';
      document.getElementById('date-to').value = '';
      document.getElementById('status').value = '';

      document.getElementById('results-section').style.display = 'none';
      searchResults = [];
    }

    // 検索結果をエクスポートする関数
    function exportHistory() {
      if (searchResults.length === 0) {
        showMessage('エクスポートする検索結果がありません', 'error');
        return;
      }

      showMessage('レポートを作成中...', '');

      google.script.run
        .withSuccessHandler(function(result) {
          showMessage('貸出履歴レポートを作成しました', '');
        })
        .withFailureHandler(function(error) {
          showMessage('レポート作成中にエラーが発生しました: ' + error.message, 'error');
        })
        .createHistoryReport(searchResults);
    }

    // メッセージを表示する関数
    function showMessage(message, type) {
      const messageEl = document.getElementById('message');
      messageEl.textContent = message;
      messageEl.className = type;

      if (type !== 'error' && message === '') {
        setTimeout(function() {
          messageEl.textContent = '';
          messageEl.className = '';
        }, 3000);
      }
    }

    // HTMLエスケープ関数
    function escapeHtml(unsafe) {
      if (!unsafe) return '';
      return unsafe
        .toString()
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // 日付フォーマット関数
    function formatDate(dateString) {
      if (!dateString) return '';
      const date = new Date(dateString);
      return date.toLocaleDateString('ja-JP', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      });
    }
  </script>

  <script>
    // WebアプリのURLはテンプレート評価時にサーバー側で埋め込まれる(往復なしで即時設定)
    (function() {
      const url = '<?!= getWebAppUrl(); ?>';
      document.querySelectorAll('.js-menu-link').forEach(el => { el.href = url; });
    })();
  </script>
</body>
</html>
